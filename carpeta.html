<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE - Carpeta de Apuntes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            background-color: #000000; 
            color: #ffffff;
            padding: 20px;
        }

        .header-carpeta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
        }

        .btn-regresar {
            padding: 8px 16px;
            background-color: #1c1f26;
            border: 2px solid #333333;
            color: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
                .hoja-container {
            width: 95%;            /* Ocupa casi todo el ancho de la pantalla */
            max-width: 900px;      /* Pero no se pasa de 900px para que no se desarme */
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 4px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            padding: 0px; 
            margin: 0 auto 40px auto; /* Lo centra y le da espacio abajo */
        }



                /* Matriz aumentada para conservar el área útil de 53 x 35 */
                    .cuadricula-matematica {
            display: grid;
            grid-template-columns: repeat(37, 1fr); 
            grid-template-rows: repeat(55, 1fr);    
            width: 100%;           
            height: auto;          /* El alto se calcula solo de forma perfecta */
            aspect-ratio: 37 / 55; /* Mantiene la geometría exacta de tus cuadrados */
            background-color: #ffffff;
        }

        

        /* Cada celda cuadriculada exacta */
        .cuadradito {
            border-right: 1px solid rgba(0, 0, 0, 0.15); /* Negro suave */
            border-bottom: 1px solid rgba(0, 0, 0, 0.15); /* Negro suave */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Clase especial para la primera y última columna (líneas verticales del margen) */
        .sin-borde-derecho {
            border-right: none !important;
        }

        /* Clase especial para la primera y última fila (líneas horizontales del margen) */
        .sin-borde-inferior {
            border-bottom: none !important;
        }

                   .celda-input {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    text-align: center;
    font-family: sans-serif;
    font-size: 17px;        
    color: #000000;
    font-weight: bold;
    outline: none;
    padding: 0;
    letter-spacing: 0px;    
    display: block;
}


        .celda-input:focus {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="header-carpeta">
        <h2>📂 MI CARPETA DE APUNTES</h2>
        <a href="index.html" class="btn-regresar">Volver al Hangar</a>
    </div>

    <div class="hoja-container">
        <div class="cuadricula-matematica" id="grid-plantilla">
            <!-- Celdas inyectadas dinámicamente -->
        </div>
    </div>
          <script>
        const grid = document.getElementById('grid-plantilla');
        const COLS = 37; 
        const ROWS = 55; 

        // 1. GENERAR LA CUADRÍCULA DE FONDO IDÉNTICA
        for (let r = 1; r <= ROWS; r++) {
            // Creamos un contenedor contenedor para cada fila real
            const filaContenedor = document.createElement('div');
            filaContenedor.style.display = 'contents'; // Mantiene el CSS Grid intacto

            for (let c = 1; c <= COLS; c++) {
                const cuadro = document.createElement('div');
                cuadro.className = 'cuadradito';
                
                const esPrimeraFila = (r === 1);
                const esUltimaFila = (r === ROWS);
                const esPrimeraColumna = (c === 1);
                const esUltimaColumna = (c === COLS);

                // Mantener tus márgenes blancos limpios en los 4 lados
                if (esUltimaColumna || esUltimaFila || esPrimeraFila || esPrimeraColumna) {
                    cuadro.style.borderRight = 'none';
                    cuadro.style.borderBottom = 'none';
                }
                if (r === 2 && c >= 2 && c <= COLS) cuadro.style.borderTop = '1px solid rgba(0, 0, 0, 0.15)';
                if (c === 2 && r >= 2 && r <= ROWS) cuadro.style.borderLeft = '1px solid rgba(0, 0, 0, 0.15)';

                // Guardar la posición de la primera celda útil para meter el renglón flotante
                if (r > 1 && r < ROWS && c === 2) {
                    cuadro.id = `renglon-${r}`;
                }

                filaContenedor.appendChild(cuadro);
            }
            grid.appendChild(filaContenedor);
        }

        // 2. INYECTAR LOS RENGLONES DE TEXTO CONTINUO (Uno por fila horizontal)
        // Empezamos en la fila 2 y terminamos antes de la última fila por el margen
        for (let r = 2; r < ROWS; r++) {
            const celdaInicio = document.getElementById(`renglon-${r}`);
            if (celdaInicio) {
                const inputRenglon = document.createElement('input');
                inputRenglon.type = 'text';
                inputRenglon.className = 'celda-input';
                
                // Mapear la coordenada de la fila para los controles
                inputRenglon.dataset.row = r;

                // CSS FLOTANTE: El input mide el ancho total de la fila útil
                // 35 columnas de ancho multiplicadas por el 100% de una celda grid
                inputRenglon.style.position = 'absolute';
                inputRenglon.style.width = 'calc(35 * 100%)'; 
                inputRenglon.style.height = '100%';
                inputRenglon.style.left = '0';
                inputRenglon.style.top = '0';
                inputRenglon.style.zIndex = '5';
                inputRenglon.style.background = 'transparent';
                inputRenglon.style.border = 'none';
                inputRenglon.style.outline = 'none';
                inputRenglon.style.color = '#000000';
                inputRenglon.style.fontWeight = 'bold';
                inputRenglon.style.fontSize = '14px';
                inputRenglon.style.fontFamily = "'Segoe UI', sans-serif";
                inputRenglon.style.paddingLeft = '6px';
                
                // Ajustar el espaciado de letras nativo para que coincida sutilmente con el patrón
                inputRenglon.style.letterSpacing = '11.2px'; 

                // CONTROLES DE FLUJO INTEGRADOS (Enter y Flechas)
                inputRenglon.addEventListener('keydown', function(e) {
                    let currentRow = parseInt(this.dataset.row);
                    let targetInput = null;

                    if (e.key === 'Enter' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (currentRow < ROWS - 1) {
                            targetInput = document.querySelector(`input[data-row="${currentRow + 1}"]`);
                        }
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (currentRow > 2) {
                            targetInput = document.querySelector(`input[data-row="${currentRow - 1}"]`);
                        }
                    }

                    if (targetInput) targetInput.focus();
                });

                celdaInicio.appendChild(inputRenglon);
            }
        }
    </script>



</body>
</html>
