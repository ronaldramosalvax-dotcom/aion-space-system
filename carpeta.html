<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE - Carpeta de Apuntes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            background-color: #000000; 
            color: #ffffff;
            padding: 20px;
        }

        .header-carpeta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
        }

        .btn-regresar {
            padding: 8px 16px;
            background-color: #1c1f26;
            border: 2px solid #333333;
            color: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

               .hoja-container {
            width: 100%;
            max-width: 800px; 
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 4px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            padding: 0px; /* Cambiado de 15px a 0px para eliminar el grosor extra */
        }

                /* Matriz aumentada para conservar el área útil de 53 x 35 */
        .cuadricula-matematica {
            display: grid;
            grid-template-columns: repeat(37, 1fr); /* Cambiado de 35 a 37 */
            grid-template-rows: repeat(55, 1fr);    /* Cambiado de 53 a 55 */
            width: 100%;
            aspect-ratio: 37 / 55; /* Mantiene la proporción perfecta */
            background-color: #ffffff;
        }


        /* Cada celda cuadriculada exacta */
        .cuadradito {
            border-right: 1px solid rgba(0, 0, 0, 0.15); /* Negro suave */
            border-bottom: 1px solid rgba(0, 0, 0, 0.15); /* Negro suave */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Clase especial para la primera y última columna (líneas verticales del margen) */
        .sin-borde-derecho {
            border-right: none !important;
        }

        /* Clase especial para la primera y última fila (líneas horizontales del margen) */
        .sin-borde-inferior {
            border-bottom: none !important;
        }

              /* Celda donde puedes escribir de forma fluida */
        .celda-input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: left;       /* Cambiado de center a left para unir las letras */
            font-family: monospace; 
            font-size: 13px;        /* Un punto más pequeño para que no sature el cuadro */
            color: #000000;
            font-weight: bold;
            outline: none;
            padding: 0 0 0 4px;     /* Pequeño margen izquierdo para que no se pegue a la línea vertical */
        }


        .celda-input:focus {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="header-carpeta">
        <h2>📂 MI CARPETA DE APUNTES</h2>
        <a href="index.html" class="btn-regresar">Volver al Hangar</a>
    </div>

    <div class="hoja-container">
        <div class="cuadricula-matematica" id="grid-plantilla">
            <!-- Celdas inyectadas dinámicamente -->
        </div>
    </div>
       <script>
                const grid = document.getElementById('grid-plantilla');
        const COLS = 37; /* Cambiado de 35 a 37 */
        const ROWS = 55; /* Cambiado de 53 a 55 */


        // Bucle para mapear las posiciones exactas
        for (let r = 1; r <= ROWS; r++) {
            for (let c = 1; c <= COLS; c++) {
                const cuadro = document.createElement('div');
                cuadro.className = 'cuadradito';
                
                // Detectar si la celda está en los extremos exactos (Bordes)
                const esPrimeraFila = (r === 1);
                const esUltimaFila = (r === ROWS);
                const esPrimeraColumna = (c === 1);
                const esUltimaColumna = (c === COLS);

                // OCULTAR LÍNEAS PARA CREAR EL MARGEN LIMPIO EN LOS 4 LADOS
                // Si está en la última columna o última fila, no lleva ningún borde
                if (esUltimaColumna || esUltimaFila) {
                    cuadro.style.borderRight = 'none';
                    cuadro.style.borderBottom = 'none';
                }
                // Si está en la primera fila o primera columna, quitamos sus bordes para limpiar el inicio
                if (esPrimeraFila || esPrimeraColumna) {
                    cuadro.style.borderRight = 'none';
                    cuadro.style.borderBottom = 'none';
                }
                // Para simular la línea de margen clásica: activamos borde solo donde empieza la cuadrícula real
                                // Para simular la línea de margen clásica exacta
                if (r === 2 && c >= 2 && c <= COLS) cuadro.style.borderTop = '1px solid rgba(0, 0, 0, 0.15)';
                if (c === 2 && r >= 2 && r <= ROWS) cuadro.style.borderLeft = '1px solid rgba(0, 0, 0, 0.15)';

                       // Solo inyectar inputs si está dentro de la zona de trabajo (lejos del margen)
                if (!esPrimeraFila && !esUltimaFila && !esPrimeraColumna && !esUltimaColumna) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'celda-input';
                    input.maxLength = 1; 
                    
                    input.dataset.row = r;
                    input.dataset.col = c;

                    // 1. ESCRITURA DE CORRIDO: Salta a la derecha inmediatamente al escribir una letra o número
                    input.addEventListener('input', function() {
                        if (this.value.length === 1) {
                            let currentRow = parseInt(this.dataset.row);
                            let currentCol = parseInt(this.dataset.col);
                            if (currentCol < COLS - 1) {
                                const next = document.querySelector(`[data-row="${currentRow}"][data-col="${currentCol + 1}"]`);
                                if (next) next.focus();
                            }
                        }
                    });

                    // 2. NAVEGACIÓN Y CONTROLES ADICIONALES (Enter, Espacio y Flechas)
                    input.addEventListener('keydown', function(e) {
                        let currentRow = parseInt(this.dataset.row);
                        let currentCol = parseInt(this.dataset.col);
                        let targetInput = null;

                        if (e.key === ' ' || e.key === 'Spacebar') { // Barra espaciadora fuerza salto manual
                            e.preventDefault();
                            if (currentCol < COLS - 1) {
                                targetInput = document.querySelector(`[data-row="${currentRow}"][data-col="${currentCol + 1}"]`);
                            }
                        } else if (e.key === 'ArrowRight') {
                            if (currentCol < COLS - 1) {
                                targetInput = document.querySelector(`[data-row="${currentRow}"][data-col="${currentCol + 1}"]`);
                            }
                        } else if (e.key === 'ArrowLeft') {
                            if (currentCol > 2) {
                                targetInput = document.querySelector(`[data-row="${currentRow}"][data-col="${currentCol - 1}"]`);
                            }
                        } else if (e.key === 'ArrowDown' || e.key === 'Enter') { // Enter baja de fila
                            e.preventDefault(); 
                            if (currentRow < ROWS - 1) {
                                targetInput = document.querySelector(`[data-row="${currentRow + 1}"][data-col="${currentCol}"]`);
                            }
                        } else if (e.key === 'ArrowUp') {
                            if (currentRow > 2) {
                                targetInput = document.querySelector(`[data-row="${currentRow - 1}"][data-col="${currentCol}"]`);
                            }
                        } else if (e.key === 'Backspace' && this.value.length === 0) { // Retroceder al borrar si está vacío
                            if (currentCol > 2) {
                                targetInput = document.querySelector(`[data-row="${currentRow}"][data-col="${currentCol - 1}"]`);
                            }
                        }

                        if (targetInput) targetInput.focus();
                    });

                    cuadro.appendChild(input);
                }


                grid.appendChild(cuadro);
            }
        }
    </script>


</body>
</html>
