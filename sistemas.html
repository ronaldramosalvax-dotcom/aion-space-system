<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM - Sistemas de Ecuaciones</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f5f5f5; color: #333333; }
        .quiz-container { display: flex; width: 900px; height: 580px; background-color: #ffffff; border: 2px solid #333333; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .main-content { display: flex; flex-direction: column; width: 82%; height: 100%; position: relative; }
        .problem-block { background-color: #e3e5e8 !important; color: #000000 !important; height: 35%; padding: 25px; border-bottom: 2px solid #333333; font-size: 16px; overflow-y: auto; font-weight: bold; }
        .problem-title { font-weight: bold; font-size: 18px; margin-bottom: 8px; color: #000000 !important; }

        .interactive-block { flex: 1; background-color: #ffffff; padding: 25px; display: flex; flex-direction: column; position: relative; }
        .options-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
        .option-item { display: flex; align-items: center; gap: 15px; cursor: pointer; padding: 5px; }
        .checkbox-anchor { width: 32px; height: 32px; border: 2px solid #333333; background-color: #ffffff; border-radius: 4px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #333333; }

        .option-item.correct .checkbox-anchor { background-color: #2b78e4 !important; border-color: #2b78e4 !important; }
        .option-item.wrong .checkbox-anchor { background-color: #ff5722 !important; border-color: #ff5722 !important; }
        .option-text { font-size: 16px; color: #333333; }
        .resolution-block { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; color: #333333; padding: 30px; display: none; z-index: 10; cursor: pointer; overflow-y: auto; border: 2px solid #333333; }
        .sidebar { width: 18%; border-left: 2px solid #333333; background-color: #fcfcfc; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 30px 10px; }
        .progress-text { font-size: 14px; font-weight: bold; text-align: center; color: #333333; }
        .progress-text span { color: #2b78e4; font-size: 20px; display: block; margin-top: 5px; }
        .timer-controls { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        .timer-display { font-size: 16px; font-weight: bold; color: #ff5722; visibility: hidden; }
        .btn-stop { width: 65px; height: 65px; background-color: #ffc000; border: 2px solid #000; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; color: #000; display: flex; justify-content: center; align-items: center; visibility: hidden; }
        .results-screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 40px; text-align: center; background-color: #ffffff; }
        .results-screen h2 { font-size: 28px; color: #2b78e4; margin-bottom: 20px; }
        .medal-box { font-size: 70px; margin: 20px 0; }
        .disabled { pointer-events: none; }
        .btn-back { margin-top: 25px; padding: 12px 24px; background-color: #f2f2f2; border: 2px solid #333333; color: #333333; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .btn-back:hover { background-color: #e6e6e6; }

        /* Estilos de maquetación para las llaves y estructuras de sistemas */
        .system-bracket { border-left: 2px solid #333333; padding-left: 10px; margin: 10px 0; display: inline-block; font-family: monospace; font-size: 16px; color: #333333; }
        .frac-table { border-collapse: collapse; text-align: center; color: #333333; font-family: monospace; display: inline-block; vertical-align: middle; }
        .frac-top { border-bottom: 2px solid #333333; padding: 2px 6px; }
        .frac-bot { padding: 2px 6px; color: #333333; }
    </style>
</head>

<body>

    <div class="quiz-container">
        <div class="main-content" id="question-wrapper">
            <div class="problem-block">
                <div class="problem-title" id="p-title">Problema:</div>
                <p id="p-text">Cargando...</p>
            </div>

            <div class="interactive-block" id="int-zone">
                <ul class="options-list" id="options-box"></ul>
                <div class="resolution-block" id="res-box">
                    <h3 style="margin-bottom:15px; text-decoration:underline;">RESOLUCIÓN DEL PROBLEMA</h3>
                    <div id="res-text"></div>
                    <p style="margin-top:25px; font-size:12px; opacity:0.9; text-align:center; color: white;">[ Haz clic aquí para alternar la pantalla y ver las alternativas ]</p>
                </div>
            </div>
        </div>

        <div class="sidebar" id="side-bar">
            <div class="progress-text">AION SPACE<span>Pregunta<br><font id="p-idx">1 / 10</font></span></div>
            <div class="timer-controls">
                <div class="timer-display" id="t-display">03s</div>
                <button class="btn-stop" id="s-button">STOP</button>
            </div>
        </div>

        <div class="results-screen" id="results-panel">
            <h2>Práctica Finalizada</h2>
            <p style="font-size: 18px;" id="r-score">Efectividad: 0%</p>
            <div class="medal-box" id="r-medal"></div>
            <p style="font-size: 20px; font-weight: bold;" id="r-name">Medalla</p>
            <a href="index.html" class="btn-back">Volver a los Temas</a>
        </div>
    </div>

    <script>
        const problems = [
            { 
                t: "En el álgebra lineal, ¿en qué consiste encontrar la solución exacta de un sistema de ecuaciones?", 
                o: ["a) En hallar una ecuación que elimine las variables", "b) En encontrar los valores de las incógnitas que hacen verdaderas a todas las ecuaciones simultáneamente", "c) En igualar todos los coeficientes a cero", "d) En multiplicar el sistema por números positivos", "e) En sumar las filas sin importar las incógnitas"], 
                c: 1, 
                r: "<b>[ REGLA DE VALIDACIÓN SIMULTÁNEA ]</b><br><br>• { Valores Hallados } &rarr; Reemplazo en Sistema<br><br>• Cumplen las igualdades al mismo tiempo." 
            },
            { 
                t: "Resuelve la siguiente ecuación de primer grado y halla el valor de la incógnita x: -2x - (5 - x) = 2(3 - x) - 11 + x", 
                o: ["a) x = 0", "b) x = 4", "c) x = -2", "d) El sistema tiene infinitas soluciones", "e) El sistema no tiene solución"], 
                c: 3, 
                r: "<b>[ REDUCCIÓN LINEAL ]</b><br><br>• -2x - 5 + x = 6 - 2x - 11 + x<br>• -x - 5 = -x - 5<br>• -x + x = -5 + 5<br><br>• <b>0 = 0</b> &rarr; <b>C.S. = ℝ</b>" 
            },
            { 
                t: "Aplique el método de sustitución para resolver el siguiente sistema de dos incógnitas y halle el valor de x: { x + 2y = -11; -2x + y = -13 }", 
                o: ["a) x = -7", "b) x = -3", "c) x = 3", "d) x = 2", "e) x = 5"], 
                c: 2, 
                r: "<b>[ MÉTODO DE SUSTITUCIÓN ]</b><br><br>• Despeje: x = -11 - 2y<br>• Inserción: -2(-11 - 2y) + y = -13<br>• 22 + 4y + y = -13 &rarr; 5y = -35 &rarr; <b>y = -7</b><br>• Retorno: x = -11 - 2(-7) &rarr; <b>x = 3</b>" 
            },
            { 
                t: "Al resolver el sistema lineal empleando el método de eliminación, determine el valor de la variable y: { 3x + 7y = 12; 2x - 3y = -1 }", 
                o: ["a) y = 29/23", "b) y = 12/7", "c) y = 1", "d) y = 27/23", "e) y = -27/23"], 
                c: 3, 
                r: "<b>[ MÉTODO DE ELIMINACIÓN ]</b><br><br>• (2) x [3x + 7y = 12] &rarr; &nbsp;6x + 14y = 24<br>• (-3) x [2x - 3y = -1] &rarr; -6x + &nbsp;9y = 3<br><br>• Suma Vertical: 23y = 27 &rarr; <b>y = </b><table class='frac-table'><tr><td class='frac-top'>27</td></tr><tr><td class='frac-bot'>23</td></tr></table>"
            },
            { 
                t: "Evalúe y determine el conjunto solución del siguiente sistema lineal inconsistente: { 6x + 3y = 14; -2x - y = 3 }", 
                o: ["a) C.S. = {(2, 3)}", "b) C.S. = ℝ", "c) C.S. = 𝝓", "d) C.S. = {(0, 0)}", "e) C.S. = {(1, 12)}"], 
                c: 2, 
                r: "<b>[ EVALUACIÓN LINEAL ]</b><br><br>• Row 1: &nbsp;6x + 3y = 14<br>• (3) x Row 2: -6x - 3y = 9<br><br>• Suma Vertical: <b>0 = 23</b> (¡Absurdo!) &rarr; <b>C.S. = 𝝓</b>" 
            },
            { 
                t: "Resuelva el sistema trilineal de 3 variables por sustitución e indique el valor de la incógnita x: { 8x - 2y + 4z = 12; -7x + 2y - 5z = -4; 4x - y + 3z = 5 }", 
                o: ["a) x = -1", "b) x = 20", "c) x = 7", "d) x = 3", "e) x = 11"], 
                c: 2, 
                r: "<b>[ REDUCCIÓN TRILINEAL ]</b><br><br>• De Ec(3): y = 4x + 3z - 5<br>• Inserción en Ec(1) y Ec(2) genera bloque 2x2:<br>&nbsp;&nbsp;• -2z = 2 &rarr; <b>z = -1</b><br>&nbsp;&nbsp;• x + z = 6 &rarr; x - 1 = 6 &rarr; <b>x = 7</b>" 
            },
            { 
                t: "Calcule el valor numérico de la variable y al procesar el siguiente sistema por el método de igualación: { x + 7y = 7; 2x - 3y = 4 }", 
                o: ["a) y = 10/17", "b) y = 49/17", "c) y = -10/17", "d) y = 0", "e) y = 7/10"], 
                c: 0, 
                r: "<b>[ MÉTODO DE IGUALACIÓN ]</b><br><br>• Despejes: x = 7 - 7y &nbsp;|&nbsp; x = <table class='frac-table'><tr><td class='frac-top'>4 + 3y</td></tr><tr><td class='frac-bot'>2</td></tr></table><br>• Conexión: 7 - 7y = <table class='frac-table'><tr><td class='frac-top'>4 + 3y</td></tr><tr><td class='frac-bot'>2</td></tr></table><br>• 14 - 14y = 4 + 3y &rarr; 10 = 17y &rarr; <b>y = </b><table class='frac-table'><tr><td class='frac-top'>10</td></tr><tr><td class='frac-bot'>17</td></tr></table>" 
            },
            {      
                t: "Reduzca el bloque de tres ecuaciones lineales y determine los valores correctos que componen el Conjunto Solución: { x - 2y + 3z = 1; x + 2y - z = 13; 3x + 2y - 5z = 3 }", 
                o: ["a) C.S. = {(1, 2, 3)}", "b) C.S. = {(3, -7, 4)}", "c) C.S. = {(3, 7, 4)}", "d) C.S. = {(11, 2, 19)}", "e) El sistema no tiene solución"], 
                c: 2, 
                r: "<b>[ SISTEMA COMBINADO ]</b><br><br>• Ec(1) + Ec(2) &rarr; 2x + 2z = 14 &rarr; x + z = 7<br>• Ec(3) - Ec(2) &rarr; 2x - 4z = -10 &rarr; x - 2z = -5<br><br>• Bloque 2x2 resultante &rarr; <b>x = 3, y = 7, z = 4</b>" 
            },
            { 
                t: "Un puesto comercial vende cajas de fresas estándar a $7 y de lujo a $10. En una jornada se vendieron 135 cajas en total, recaudando un monto de $1080. ¿Cuántas cajas de cada variedad se vendieron?", 
                o: ["a) 100 estándar y 35 de lujo", "b) 80 estándar y 55 de lujo", "c) 90 estándar y 45 de lujo", "d) 95 estándar y 40 de lujo", "e) 70 estándar y 65 de lujo"], 
                c: 2, 
                r: "<b>[ MODELADO COMERCIAL ]</b><br><br>• Variables: e (estándar) &nbsp;|&nbsp; d (lujo)<br>• Balance: e + d = 135 &nbsp;|&nbsp; 7e + 10d = 1080<br><br>• Operación: 3d = 1080 - 945 &rarr; <b>d = 45</b> &nbsp;|&nbsp; <b>e = 90</b>" 
            },
            { 
                t: "Una planta química requiere producir tres fertilizantes (A, B, C) combinando fósforo, nitrógeno y potasio. Si el consumo de insumos forma el siguiente sistema: { 5A+20B+15C=2200; 20A+10B+45C=4250; 50A+60B+27C=6390 }, ¿qué volumen cumple con los insumos?", 
                o: ["a) A = 40, B = 40, C = 40", "b) A = 50, B = 30, C = 70", "c) A = 30, B = 50, C = 70", "d) A = 20, B = 60, C = 80", "e) El balance de insumos es inconsistente"], 
                c: 2, 
                r: "<b>[ BALANCE INDUSTRIAL ]</b><br><br>• Simplificación dividiendo entre 5:<br><div class='system-bracket'><table class='frac-table'><tr><td class='frac-top'>5A</td><td rowspan='2' style='padding:0 4px;'>+</td><td class='frac-top'>20B</td><td rowspan='2' style='padding:0 4px;'>+</td><td class='frac-top'>15C</td><td rowspan='2' style='padding:0 6px;'>=</td><td class='frac-top'>2200</td></tr><tr><td class='frac-bot'>5</td><td class='frac-bot'>5</td><td class='frac-bot'>5</td><td class='frac-bot'>5</td></tr></table><br><table class='frac-table' style='margin-top:10px;'><tr><td class='frac-top'>20A</td><td rowspan='2' style='padding:0 4px;'>+</td><td class='frac-top'>10B</td><td rowspan='2' style='padding:0 4px;'>+</td><td class='frac-top'>45C</td><td rowspan='2' style='padding:0 6px;'>=</td><td class='frac-top'>4250</td></tr><tr><td class='frac-bot'>5</td><td class='frac-bot'>5</td><td class='frac-bot'>5</td><td class='frac-bot'>5</td></tr></table><br><p style='margin-top:10px;'>50A + 60B + 27C = 6390</p></div><br><br><span style='color:#ffc000;'>⬇️</span><br><br>• Sistema reducido:<br><div class='system-bracket'>A + 4B + 3C = 440<br>4A + 2B + 9C = 850<br>50A + 60B + 27C = 6390</div><br><br><span style='color:#ffc000;'>⬇️</span><br><br>• <b>A = 30 &nbsp;|&nbsp; B = 50 &nbsp;|&nbsp; C = 70</b>" 
            }
        ];

        let index = 0; let score = 0; let clock = null; let count = 3; let paused = false; let viewRes = false;

        const pTitle = document.getElementById('p-title');
        const pText = document.getElementById('p-text');
        const optionsBox = document.getElementById('options-box');
        const resBox = document.getElementById('res-box');
        const resText = document.getElementById('res-text');
        const pIdx = document.getElementById('p-idx');
        const tDisplay = document.getElementById('t-display');
        const sButton = document.getElementById('s-button');

        function render() {
            paused = false; viewRes = false; count = 3;
            clearInterval(clock);
            resBox.style.display = 'none';
            tDisplay.style.visibility = 'hidden';
            sButton.style.visibility = 'hidden';
            sButton.textContent = "STOP";
            sButton.style.backgroundColor = "#ffc000";
            optionsBox.classList.remove('disabled');

            const item = problems[index];
            pTitle.textContent = `Problema ${index + 1}:`;
            pIdx.textContent = `${index + 1} / 10`;
            pText.textContent = item.t;
            resText.innerHTML = item.r;

                optionsBox.innerHTML = '';
            
                item.o.forEach((txt, i) => {
                const partes = txt.split(') '); 
                const letra = partes[0] ? partes[0].trim() : ''; 
                const formula = partes[1] ? partes[1].trim() : txt; 

                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `<div class="checkbox-anchor">${letra}</div><div class="option-text">${formula}</div>`;
                li.onclick = () => evaluate(i, item.c);
                optionsBox.appendChild(li);
            });

        function evaluate(chosen, correct) {
            optionsBox.classList.add('disabled');
            const lis = document.querySelectorAll('.option-item');
            if (chosen === correct) { 
                lis[chosen].classList.add('correct'); 
                score++; 
            } else { 
                lis[chosen].classList.add('wrong'); 
            }
            tDisplay.style.visibility = 'visible';
            sButton.style.visibility = 'visible';
            startClock();
        }

        function startClock() {
            tDisplay.textContent = `0${count}s`;
            clock = setInterval(() => {
                if (!paused) {
                    count--;
                    tDisplay.textContent = `0${count}s`;
                    if (count <= 0) { clearInterval(clock); step(); }
                }
            }, 1000);
        }

        sButton.onclick = function() {
            if (!paused) {
                paused = true;
                tDisplay.textContent = "PAUSA";
                sButton.textContent = "SIG.";
                sButton.style.backgroundColor = "#2ea44f";
                resBox.style.display = 'block';
                viewRes = true;
            } else { 
                step(); 
            }
        };

        document.getElementById('int-zone').onclick = function(e) {
            if (!paused) return;
            if (viewRes) { resBox.style.display = 'none'; viewRes = false; }
            else if (!e.target.closest('#options-box')) { resBox.style.display = 'block'; viewRes = true; }
        };

        function step() {
            index++;
            if (index < 10) { render(); }
            else { finish(); }
        }

        function finish() {
            document.getElementById('question-wrapper').style.display = 'none';
            document.getElementById('side-bar').style.display = 'none';
            
            const resultsPanel = document.getElementById('results-panel');
            resultsPanel.style.display = 'flex';
            
            const pct = (score / 10) * 100;
            document.getElementById('r-score').textContent = `Efectividad: ${pct}% (${score} de 10 correctas)`;
            
            const medalBox = document.getElementById('r-medal');
            const nameBox = document.getElementById('r-name');
            
            if (score === 10) {
                medalBox.textContent = "🌌";
                nameBox.textContent = "Medalla de Rodio - Élite Cuántica";
                nameBox.style.color = "#333333";
            } else if (score >= 8) {
                medalBox.textContent = "💎";
                nameBox.textContent = "Medalla de Diamante - Director de Misión";
                nameBox.style.color = "#b9f2ff";
            } else if (score >= 6) {
                medalBox.textContent = "🥇";
                nameBox.textContent = "Medalla de Oro - Ingeniero de Vuelo";
                nameBox.style.color = "#d4af37";
            } else if (score >= 4) {
                medalBox.textContent = "🥈";
                nameBox.textContent = "Medalla de Plata - Técnico de Operaciones";
                nameBox.style.color = "#aaa9ad";
            } else {
                medalBox.textContent = "🥉";
                nameBox.textContent = "Medalla de Bronce - Cadete en Práctica";
                nameBox.style.color = "#cd7f32";
            }
        }

        render();
    </script>
</body>
</html>
