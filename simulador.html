<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE - Simulador de Código</title>
    <style>
        :root {
            --bg-space: #0b0f19;
            --panel-blue: #131c2e;
            --neon-blue: #00d2ff;
            --text-light: #e2e8f0;
            --border-blue: #1e293b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-space);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--panel-blue);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--border-blue);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--neon-blue);
        }

        /* Contenedor Híbrido */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column; /* Vertical por defecto en celular */
            padding: 15px;
            gap: 15px;
        }

        /* Panel de Reto */
        .panel-challenge {
            background-color: var(--panel-blue);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-blue);
        }

        .timer-box {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff3366;
            text-align: center;
            margin: 10px 0;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }

        /* Editor de Código */
        .editor-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 180px;
            background-color: #050811;
            color: #5af7ff;
            border: 1px solid var(--border-blue);
            border-radius: 6px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        /* Botones Espaciales */
        .btn-run {
            background: linear-gradient(135deg, #00d2ff, #0066ff);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-run:hover {
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        }

        /* Consola Azul Espacial */
        .console-box {
            background-color: #040814;
            border: 1px solid #102a45;
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            min-height: 100px;
            box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.1);
        }

        .console-title {
            color: #64748b;
            font-size: 0.8rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .console-output {
            color: var(--neon-blue);
            margin: 0;
            white-space: pre-wrap;
        }

        /* Cambio de diseño al girar la pantalla (Horizontal/PC) */
        @media (min-width: 768px) {
            .container {
                flex-direction: row; /* Pantalla dividida avanzada */
            }
            .panel-challenge {
                flex: 1;
            }
            .editor-box {
                flex: 1.5;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>AION SPACE SYSTEM // LAB</h1>
    </header>

    <div class="container">
        <!-- Panel Izquierdo: Reto y Tiempo -->
        <div class="panel-challenge">
            <h3 style="margin-top:0; color: var(--neon-blue);">RANGO: PILOTO NOVATO</h3>
            <div class="timer-box" id="cronometro">00:45</div>
            <p id="enunciado"><strong>Reto de Lógica 1:</strong> Crea un algoritmo que reciba una matriz de 2x2 y verifique si es una matriz identidad. Presiona "Ejecutar Propulsores" para validar tu lógica.</p>
        </div>

        <!-- Panel Derecho: Editor y Consola -->
        <div class="editor-box">
            <textarea id="codigo-editor" placeholder="// Escribe tu lógica de JavaScript aquí...&#10;function verificarMatriz(m) {&#10;    // Tu código secreto&#10;}"></textarea>
            
            <button class="btn-run" onclick="ejecutarCodigo()">EJECUTAR PROPULSORES</button>

            <div class="console-box">
                <div class="console-title">Consola de Telemetría Azul</div>
                <p class="console-output" id="consola-resultado">> Sistema listo. Esperando transmisión de código...</p>
            </div>
        </div>
    </div>

    <script>
        function ejecutarCodigo() {
            const salida = document.getElementById('consola-resultado');
            salida.innerHTML = "> Ejecutando telemetría...\n> Analizando variables...\n> ¡Lógica procesada con éxito!";
        }
    </script>
</body>
</html>
