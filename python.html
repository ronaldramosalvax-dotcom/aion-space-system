<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM - Simulador Python Integrado</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #ffd43b;
            --accent-blue: #306998;
            --text-color: #c9d1d9;
            --terminal-bg: #05070a;
            --border-color: #30363d;
        }

        body {
            font-family: 'Segoe UI', Monaco, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            text-shadow: 0 0 10px rgba(255, 212, 59, 0.2);
        }

        .subtitle {
            color: #8b949e;
            margin: 0;
            font-size: 1rem;
        }

        .workspace {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        .label-box {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 250px;
            background-color: var(--terminal-bg);
            color: #ffd43b;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            line-height: 1.5;
        }

        .actions {
            margin: 15px 0;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #ffe066;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 212, 59, 0.3);
        }

        .btn-clear {
            background-color: transparent;
            color: #8b949e;
            border: 1px solid var(--border-color);
        }

        .btn-clear:hover {
            background-color: rgba(255,255,255,0.05);
            color: #ffffff;
        }

        .console-output {
            width: 100%;
            height: 180px;
            background-color: var(--terminal-bg);
            color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            overflow-y: auto;
            box-sizing: border-box;
            white-space: pre-wrap;
        }

        .nav-footer {
            margin-top: 25px;
        }

        .back-link {
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Simulador Python Integrado</h1>
        <p class="subtitle">Entorno Avanzado de Pruebas de Código</p>
    </header>

    <div class="workspace">
        <div class="label-box">
            <span>Editor Python 3 (Sintaxis Real):</span>
            <span style="color: #8b949e; font-size: 0.8rem;">Soporta: print, variables, if / else (con sangrías)</span>
        </div>
        
        <textarea id="editor" spellcheck="false"># Sistema Avanzado de Seguridad de Claves
print("--- INICIANDO PROTOCOLO DE CRIPTOGRAFÍA ---")

clave_original = 4500
token_seguridad = 125
factor_multiplicador = 4

# Algoritmo de Encriptacion
clave_encriptada = (clave_original * factor_multiplicador) + token_seguridad
print("Generando firma digital encriptada...")
print(clave_encriptada)

# Algoritmo de Desencriptacion
clave_desencriptada = (clave_encriptada - token_seguridad) / factor_multiplicador
print("Descifrando datos en el nodo central...")
print(clave_desencriptada)

# Validacion mediante condicional doble
if clave_desencriptada == clave_original:
    print("SISTEMA SEGURO: La clave es idéntica. Acceso concedido.")
else:
    print("ALERTA DE INTRUSO: Los datos no coinciden. Bloqueando terminal.")</textarea>

        <div class="actions">
            <button onclick="ejecutarPython()">▶ Ejecutar Código</button>
            <button class="btn-clear" onclick="limpiarConsola()">Limpiar Consola</button>
        </div>

        <div class="label-box">
            <span>Pantalla de Salida (Consola):</span>
        </div>
        <div id="output" class="console-output">Haga clic en "Ejecutar Código" para ver los resultados aquí...</div>
    </div>

    <div class="nav-footer">
        <a href="pruebas.html" class="back-link">← Volver al Área de Pruebas</a>
    </div>

    <script>
        function limpiarConsola() {
            document.getElementById('output').textContent = '';
        }

        function ejecutarPython() {
            const code = document.getElementById('editor').value;
            const outputDiv = document.getElementById('output');
            outputDiv.textContent = ''; 
            
            const lines = code.split('\n');
            let variables = {};
            let logs = [];
            let saltarBloqueElse = false;
            let enBloqueIf = false;

            try {
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    
                    if (!line || line.startsWith('#')) {
                        continue;
                    }

                    if (line.startsWith('else:')) {
                        if (enBloqueIf && !saltarBloqueElse) {
                            saltarBloqueElse = true;
                        } else if (enBloqueIf && saltarBloqueElse) {
                            saltarBloqueElse = false;
                        }
                        continue;
                    }

                    if (saltarBloqueElse) continue;

                    if (line.startsWith('if ')) {
                        enBloqueIf = true;
                        let condicion = line.substring(3).replace(':', '').trim();
                        condicion = condicion.replace(/==/g, '===');
                        
                        for (let v in variables) {
                            let regex = new RegExp('\\b' + v + '\\b', 'g');
                            condicion = condicion.replace(regex, variables[v]);
                        }
                        
                        try {
                            let resultadoCondicion = eval(condicion);
                            if (resultadoCondicion) {
                                saltarBloqueElse = false;
                            } else {
                                saltarBloqueElse = true;
                            }
                        } catch(e) {
                            saltarBloqueElse = true;
                        }
                        continue;
                    }

                    if (line.startsWith('print(') && line.endsWith(')')) {
                        let contenido = line.substring(6, line.length - 1).trim();
                        
                        if ((contenido.startsWith('"') && contenido.endsWith('"')) || (contenido.startsWith("'") && contenido.endsWith("'"))) {
                            logs.push(contenido.slice(1, -1));
                        } else {
                            for (let v in variables) {
                                let regex = new RegExp('\\b' + v + '\\b', 'g');
                                contenido = contenido.replace(regex, variables[v]);
                            }
                            try {
                                let res = eval(contenido);
                                logs.push(res !== undefined ? res : contenido);
                            } catch(e) {
                                logs.push(contenido);
                            }
                        }
                        continue;
                    }

                    if (line.includes('=')) {
                        let partes = line.split('=');
                        let varName = partes[0].trim();
                        let expresion = partes[1].trim();

                        for (let v in variables) {
                            let regex = new RegExp('\\b' + v + '\\b', 'g');
                            expresion = expresion.replace(regex, variables[v]);
                        }

                        try {
                            variables[varName] = eval(expresion);
                        } catch (err) {
                            throw new Error(`Error en la línea ${i+1}`);
                        }
                        continue;
                    }
                }

                           outputDiv.textContent = logs.join('\n') || "Script ejecutado correctamente.";
        } catch (error) {
            outputDiv.textContent = `❌ Error de Sintaxis en el script de Python.`;
        }
    }
</script>
</body>
</html>
