<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM - Simulador Python</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #306998;
            --accent-yellow: #ffd43b;
            --text-color: #c9d1d9;
            --terminal-bg: #05070a;
            --border-color: #30363d;
        }

        body {
            font-family: 'Segoe UI', Monaco, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            text-shadow: 0 0 10px rgba(48, 105, 152, 0.3);
        }

        .subtitle {
            color: #8b949e;
            margin: 0;
            font-size: 1rem;
        }

        .workspace {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        .label-box {
            font-size: 0.9rem;
            color: var(--accent-yellow);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .iframe-container {
            width: 100%;
            height: 480px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: var(--terminal-bg);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .nav-footer {
            margin-top: 25px;
        }

        .back-link {
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-yellow);
        }
    </style>
</head>
<body>

    <header>
        <h1>Simulador Python Integrado</h1>
        <p class="subtitle">AION SPACE SYSTEM • Entorno Avanzado de Ejecución</p>
    </header>

    <div class="workspace">
        <div class="label-box">
            <span>Consola de Pruebas Interactiva (Python 3):</span>
            <span style="color: var(--accent-color); font-weight: bold;">Listo para picar código</span>
        </div>
        
        <div class="iframe-container">
            <iframe src="https://trinket.io"></iframe>
        </div>
    </div>

    <div class="nav-footer">
        <a href="index.html" class="back-link">← Volver al Panel Principal de AION</a>
    </div>

</body>
</html>
