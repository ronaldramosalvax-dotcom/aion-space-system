<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM | Hangar Táctico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background-color: #060913;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-navbar {
            width: 100%; background-color: rgba(35, 39, 42, 0.95); border-bottom: 2px solid #f0a04b;
            box-shadow: 0 4px 15px rgba(240, 160, 75, 0.3); padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .brand-logo { font-size: 1.25rem; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        .btn-account {
            background-color: #ffffff; color: #23272a; border: none; padding: 10px 24px;
            border-radius: 25px; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-decoration: none;
        }
        
        .hangar-container { max-width: 950px; width: 90%; padding: 40px 0; text-align: center; }
        
        .hangar-header-actions {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px;
        }
        .btn-regresar-verde {
            background: #00ff88; color: #060913; border: none; padding: 12px 20px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-family: monospace;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        /* EL BOTÓN AZUL QUE DISPARA EL ESCÁNER */
        .btn-escaneo-azul {
            background: #404eed; color: #ffffff; border: none; padding: 12px 25px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-family: monospace;
            box-shadow: 0 0 15px rgba(64, 78, 237, 0.4); font-size: 13px; letter-spacing: 1px;
        }
        .btn-escaneo-azul:hover { background: #5765f2; }

        /* REJILLA ESTRICTA DE 5 COLUMNAS Y 3 FILAS SEGÚN TU ESQUEMA */
        .avatar-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr);
            gap: 15px; 
            background: #000000;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @media (max-width: 800px) {
            .avatar-grid { grid-template-columns: repeat(3, 1fr); }
            .hangar-header-actions { flex-direction: column; gap: 15px; }
        }
        
        /* CELDAS DE TU MATRIZ DE WORD */
        .avatar-card {
            background: transparent; 
            border: 2px solid #ffffff; /* Líneas blancas de tu diseño original */
            border-radius: 6px;
            min-height: 145px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 12px;
            padding: 10px;
            transition: all 0.2s ease;
        }
        
        /* Clase especial para cuando el piloto haga clic sobre un personaje revelado */
        .avatar-card.revelada {
            background: #111622;
            border-color: rgba(64, 78, 237, 0.5);
            cursor: pointer;
        }
        .avatar-card.revelada:hover {
            border-color: #00ff88;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }
        .avatar-card.seleccionada {
            border-color: #00ff88 !important;
            background: #162032 !important;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4) !important;
        }
        
        .avatar-card img { 
            width: 85px; height: 85px; border-radius: 50%; object-fit: cover; 
            border: 2px solid #404eed; background: #1a2238; display: none; /* OCULTAS POR DEFECTO */
        }
        .avatar-card span { 
            font-family: monospace; font-weight: bold; font-size: 10px; color: #ffffff; 
            letter-spacing: 0.5px; display: none; /* OCULTAS POR DEFECTO */
        }
    </style>
</head>
<body>

        <!-- Barra Superior Unificada (Botones arriba de la línea) -->
    <header class="top-navbar">
        <!-- El Botón Verde ahora vive fijo a la izquierda -->
        <button class="btn-regresar-verde" onclick="window.location.href='index.html'">◀ VOLVER AL PANEL</button>
        
        <!-- Bloque de la derecha con Discord, foto y el Botón Azul integrado -->
        <div style="display: flex; align-items: center; gap: 15px;">
            <button id="btn-disparar-escaner" class="btn-escaneo-azul" onclick="ejecutarEscanerTactico()">📡 INICIAR ESCANEO</button>
            <a href="https://discord.gg" target="_blank" class="btn-account">Conectar Discord</a>
            <img id="avatar-nav-bar" src="logo.png" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid #00ff88; object-fit: cover;">
        </div>
    </header>
    

    <main class="hangar-container">


        <!-- LA MATRIZ DE 15 RECUADROS RECTOS DE TU WORD -->
        <div class="avatar-grid">
            <!-- Fila 1 -->
            <div id="slot-0" class="avatar-card" data-avatar="logo.png">
                <img src="logo.png">
                <span>SISTEMA AION</span>
            </div>
            <div id="slot-1" class="avatar-card" data-avatar="piloto1.png">
                <img src="piloto1.png">
                <span>PILOTO TÁCTICO 01</span>
            </div>
            <div id="slot-2" class="avatar-card" data-avatar="piloto2.png">
                <img src="piloto2.png">
                <span>PILOTO TÁCTICO 02</span>
            </div>
            <div id="slot-3" class="avatar-card" data-avatar="piloto3.png">
                <img src="piloto3.png">
                <span>PILOTO TÁCTICO 03</span>
            </div>
            <div class="avatar-card"></div>

            <!-- Fila 2 -->
            <div class="avatar-card"></div>
            <div class="avatar-card"></div>
            <div class="avatar-card"></div>
            <div class="avatar-card"></div>
            <div class="avatar-card"></div>

            <!-- Fila 3 -->
            <div class="avatar-card"></div>
            <div class="avatar-card"></div>
            <div class="avatar-card"></div>
            <div class="avatar-card"></div>
            <div class="avatar-card"></div>
        </div>
    </main>

    <!-- MOTOR LOGÍSTICO Y CONEXIÓN CON FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, onAuthStateChanged } from "https://gstatic.com";
        import { getDatabase, ref, update } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCAb9jQGpTgP_rSWPczHoZYHGxfj5NReYI",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "aion-space-system",
            storageBucket: "aion-space-system.firebasestorage.app",
            messagingSenderId: "247082868280",
            appId: "1:247082868280:web:c0aeeb2a62bc02c2f6d0cd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let usuarioEmailLimpio = "";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioEmailLimpio = user.email.replace(/[^a-zA-Z0-9]/g, "");
                const sesion = localStorage.getItem("cuenta_aion_instalada");
                if (sesion) {
                    const perfil = JSON.parse(sesion);
                    document.getElementById("avatar-nav-bar").src = perfil.avatar || "logo.png";
                }
            } else {
                window.location.href = "index.html";
            }
        });

              // Activación forzada por ID al presionar el Botón Azul
        document.getElementById("btn-disparar-escaner").onclick = function() {
            const btn = document.getElementById("btn-disparar-escaner");
            btn.innerHTML = "⚡ ESCANEO COMPLETO";
            btn.style.background = "#23272a";
            btn.style.borderColor = "#00ff88";
            btn.disabled = true;

            // Recorre y enciende los 4 cuadrantes principales de tu hoja
            for (let i = 0; i <= 3; i++) {
                const celda = document.getElementById(`slot-${i}`);
                if (celda) {
                    celda.classList.add("revelada");
                    
                    // Revela la imagen del piloto y el texto
                    const img = celda.querySelector("img");
                    const span = celda.querySelector("span");
                    if (img) img.style.display = "block";
                    if (span) span.style.display = "block";
                    
                    // Vincula la selección final en la base de datos al hacer clic
                    celda.onclick = function() {
                        procesarSeleccionFinalPiloto(celda);
                    };
                }
            }
        };

        // Guarda oficialmente el avatar seleccionado en Firebase Realtime Database
        async function procesarSeleccionFinalPiloto(elemento) {
            document.querySelectorAll('.avatar-card').forEach(card => card.classList.remove('seleccionada'));
            elemento.classList.add('seleccionada');

            const archivoAvatar = elemento.getAttribute('data-avatar');
            if (!usuarioEmailLimpio || !archivoAvatar) return;

            const usuarioRef = ref(db, 'usuarios/' + usuarioEmailLimpio);

            try {
                // Actualiza el nodo en la nube
                await update(usuarioRef, { avatar: archivoAvatar });
                
                // Actualiza la sesión de tu index.html
                const sesion = localStorage.getItem("cuenta_aion_instalada");
                if (sesion) {
                    const perfil = JSON.parse(sesion);
                    perfil.avatar = archivoAvatar;
                    localStorage.setItem("cuenta_aion_instalada", JSON.stringify(perfil));
                }

                // Cambia el avatar del Navbar en vivo
                document.getElementById("avatar-nav-bar").src = archivoAvatar;
                alert(`📡 TRANSMISIÓN CENTRAL EXITOSA:\nTu firma en red ahora opera bajo el avatar [${archivoAvatar}]`);
            } catch (error) {
                alert("Falla crítica en la subida: " + error.message);
            }
        }
    </script>
</body>
</html>
