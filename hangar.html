        onAuthStateChanged(auth, (user) => {

       async function GuardarAvatarFinal(elemento) {
    document.querySelectorAll('.avatar-card').forEach(card => card.classList.remove('seleccionada'));
    elemento.classList.add('seleccionada');

    const archivoAvatar = elemento.getAttribute('data-avatar');
    if (!archivoAvatar) return;

    // 1. Cambio visual instantáneo en tu pantalla
    document.getElementById("avatar-nav-bar").src = archivoAvatar;
    document.getElementById("avatar-modal-perfil").src = archivoAvatar;

    // 2. Guardado automático en el almacenamiento local
    const sesion = localStorage.getItem("cuenta_aion_instalada");
    let perfil = sesion ? JSON.parse(sesion) : { nombre: "Piloto", codigo: "#AION" };
    perfil.avatar = archivoAvatar;
    localStorage.setItem("cuenta_aion_instalada", JSON.stringify(perfil));

      // 3. Sincronización con la nube en segundo plano si hay sesión
    if (usuarioEmailLimpio) {
        // CORRECCIÓN CENTRAL: Pasamos la variable 'db' oficial
        const usuarioRef = ref(db, 'usuarios/' + usuarioEmailLimpio);
        try {
            await update(usuarioRef, { avatar: archivoAvatar });
            
            // Avisamos al sistema global que el piloto cambió de identidad
            window.dispatchEvent(new Event('authPilotoListo'));
        } catch (error) {
            console.error("Falla en la nube: " + error.message);
        }
    }

    alert(`📡 TRANSMISIÓN CENTRAL EXITOSA:\nTu firma en red ahora opera bajo el avatar [${archivoAvatar}]`);
}

const MAX_CARACTERES_RENGON = 78;

if (cuerpoTabla && cuerpoTabla.children.length === 0) {
    for (let f = 1; f <= TOTAL_RENGI; f++) {
        const filaTR = document.createElement('tr');
        const celdaTD = document.createElement('td');
        
        celdaTD.id = `linea-u-${f}`;
        celdaTD.setAttribute('contenteditable', 'true');
        
        // Estilo compacto y limpio que llena las 34 columnas sin saltarse renglones en blanco
        celdaTD.style = "min-height: 20px; height: 20px; line-height: 20px; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 13px; color: #000000; outline: none; padding: 0 5px; box-sizing: border-box; white-space: normal; word-break: break-all;";

        celdaTD.oninput = function() {
            // Elimina etiquetas basura automáticas del navegador para evitar renglones en blanco vacíos
            if (celdaTD.innerHTML.includes('<br>') || celdaTD.innerHTML.includes('<p>')) {
                celdaTD.innerHTML = celdaTD.innerText;
            }
            if (celdaTD.innerText.length >= MAX_CARACTERES_RENGON) {
                saltarRenglon(f, true);
            }
        };

        celdaTD.onkeydown = function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                saltarRenglon(f, true);
            }
            if (e.key === 'Backspace') {
                const seleccion = window.getSelection();
                if (seleccion.rangeCount > 0) {
                    const rangoActual = seleccion.getRangeAt(0);
                    if (rangoActual.startOffset === 0 && rangoActual.endOffset === 0) {
                        e.preventDefault();
                        unirRenglonesHaciaArriba(f);
                    }
                }
            }
        };

        filaTR.appendChild(celdaTD);
        cuerpoTabla.appendChild(filaTR);
    }
}

function unirRenglonesHaciaArriba(filaActual) {
    if (filaActual > 1) {
        const renglonSuperior = document.getElementById(`linea-u-${filaActual - 1}`);
        const renglonActual = document.getElementById(`linea-u-${filaActual}`);
        
        if (renglonSuperior && renglonActual) {
            const textoActual = renglonActual.innerText;
            const posicionFocoInicio = renglonSuperior.innerText.length;
            
            if (textoActual) {
                renglonSuperior.innerText += textoActual;
                renglonActual.innerText = '';
            }
            
            renglonSuperior.focus();
            
            const rango = document.createRange();
            const seleccion = window.getSelection();
            if (renglonSuperior.firstChild) {
                rango.setStart(renglonSuperior.firstChild, posicionFocoInicio);
                rango.setEnd(renglonSuperior.firstChild, posicionFocoInicio);
            } else {
                rango.selectNodeContents(renglonSuperior);
                rango.collapse(false);
            }
            seleccion.removeAllRanges();
            seleccion.addRange(rango);
        }
    }
}

function saltarRenglon(filaActual, haciaAbajo) {
    const destinoFila = haciaAbajo ? filaActual + 1 : filaActual - 1;
    if (destinoFila >= 1 && destinoFila <= TOTAL_RENGI) {
        const siguiente = document.getElementById(`linea-u-${destinoFila}`);
        if (siguiente) {
            siguiente.focus();
            const rango = document.createRange();
            const seleccion = window.getSelection();
            rango.selectNodeContents(siguiente);
            rango.collapse(!haciaAbajo);
            seleccion.removeAllRanges();
            seleccion.addRange(rango);
        }
    }
}

       // 🗂️ BANCO CENTRAL DE DESAFÍOS DE PROGRAMACIÓN (NIVELES 1 AL 3)

                // Asegúrate de que esta variable esté declarada con el valor = 1
        let nivelMaximoAlcanzado = 1; 

        let gamePuntos = 0;
        let gameVidas = 2; 
        let gapActivoId = 0;
        let gameCorriendo = false;
        let posicionScriptY = 320;
        let velocidadDesplazamiento = 0.85; 
        let animacionFrameId = null;

        
        const btnNivel1 = document.getElementById("btn-disparar-nivel1");
        btnNivel1.onmouseover = function() { this.style.transform = "scale(1.03)"; this.style.backgroundColor = "#b3b3b3"; };
        btnNivel1.onmouseout = function() { this.style.transform = "scale(1)"; this.style.backgroundColor = "#a6a6a6"; };

                btnNivel1.onclick = function() {
            const datosRetoActual = BASE_DATOS_RETO[nivelMaximoAlcanzado] || BASE_DATOS_RETO[1];

            document.getElementById("contenedor-apuntes-hangar").style.display = "none";
            document.getElementById("aion-game-menu-inicio").style.display = "none";
            
            const tableroJuego = document.getElementById("aion-game-tablero-activo");
            tableroJuego.style.display = "flex";
            
            const cuentaLocal = localStorage.getItem("cuenta_aion_instalada");
            let nombrePiloto = "Piloto";
            let codigoPiloto = "#0000";
            if (cuentaLocal) {
                const perfil = JSON.parse(cuentaLocal);
                nombrePiloto = perfil.nombre || nombrePiloto;
                codigoPiloto = perfil.codigo || codigoPiloto;
            }

            gameCorriendo = true;
            gapActivoId = 0;
            gameVidas = 2;
            gamePuntos = 0;
            
            velocidadDesplazamiento = datosRetoActual.velocidad;
            window.gapsTotalesNivel = datosRetoActual.totalGaps; 
            window.respuestasNivelActual = datosRetoActual.respuestas;

            const bloqueMovil = document.getElementById("aion-bloque-movil-script");
            bloqueMovil.innerHTML = `<p style="color: #444444; font-weight: bold;">${datosRetoActual.titulo}</p>`;
            
            datosRetoActual.lineas.forEach(linea => {
                bloqueMovil.innerHTML += `<p>${linea}</p>`;
            });

            document.querySelectorAll(".game-gap").forEach(el => {
                el.style = "display:inline-block; width:120px; height:26px; border:2px solid #000; background:#ffffff; color:#000; text-align:center; line-height:22px; font-weight:bold; font-size:14px; border-radius:4px; pointer-events: auto;";
            });

            posicionScriptY = document.getElementById("aion-consola-desplazable").clientHeight - 40;
            
            document.getElementById("txt-piloto-game").innerText = `PILOTO: ${nombrePiloto} ${codigoPiloto} | DESAFÍO Lvl ${nivelMaximoAlcanzado}`;
            document.getElementById("txt-vidas-game").innerText = `INTENTOS: ❤️ ❤️ | PUNTOS: 0`;
            
            document.getElementById("gap-0").style.borderColor = "#ffaa00"; 

            datosRetoActual.alternativas.forEach((textoAlternativa, idx) => {
                const btnCaja = document.getElementById(`g-opt-${idx}`);
                if (btnCaja) {
                    btnCaja.innerText = textoAlternativa;
                    btnCaja.style.opacity = "1";
                    btnCaja.style.backgroundColor = "#ffffff";
                    btnCaja.style.pointerEvents = "auto";
                    
                    btnCaja.onmouseover = function() { this.style.backgroundColor = "#e6e6e6"; };
                    btnCaja.onmouseout = function() { this.style.backgroundColor = "#ffffff"; };
                    
                    btnCaja.onclick = function() { verificarAlternativaPresionada(btnCaja.innerText, `g-opt-${idx}`); };
                }
            });

            bucleMovimientoUniforme();
        };


        function bucleMovimientoUniforme() {
            if (!gameCorriendo) return;

            posicionScriptY -= velocidadDesplazamiento;
            const bloqueMovil = document.getElementById("aion-bloque-movil-script");
            
            if (bloqueMovil) {
                bloqueMovil.style.top = posicionScriptY + 'px';

                if (posicionScriptY < -bloqueMovil.clientHeight) {
                    finalizarSistemaJuego(false, "El tiempo expiró. El script superó el límite superior del monitor.");
                }
            }
            animacionFrameId = requestAnimationFrame(bucleMovimientoUniforme);
        }

                      function verificarAlternativaPresionada(textoBoton, idBotonElemento) {
            if (!gameCorriendo) return;

            const txtVidas = document.getElementById("txt-vidas-game");

            if (textoBoton === window.respuestasNivelActual[gapActivoId]) {
                const huecoElemento = document.getElementById(`gap-${gapActivoId}`);
                huecoElemento.innerText = textoBoton;
                huecoElemento.style.backgroundColor = "transparent";
                huecoElemento.style.color = "#00ff88";
                huecoElemento.style.borderColor = "#00ff88";

                const btnUsado = document.getElementById(idBotonElemento);
                btnUsado.style.opacity = "0.2";
                btnUsado.style.pointerEvents = "none";

                gamePuntos += 250;
                gapActivoId++;

                if (gapActivoId < window.gapsTotalesNivel) {
                    const proxGap = document.getElementById(`gap-${gapActivoId}`);
                    if (proxGap) proxGap.style.borderColor = "#ffaa00";
                } else {
                    finalizarSistemaJuego(true, "¡Rutina de inicialización compilada con éxito!");
                }
            } else {
                // 🔴 EN LUGAR DE ALERT: Descontamos la vida y cambiamos el texto superior a rojo temporalmente
                gameVidas--;
                
                if (txtVidas) {
                    txtVidas.style.color = "#ef4444"; // Pintar la barra de rojo
                    setTimeout(() => { if(gameCorriendo) txtVidas.style.color = "#00ff88"; }, 800); // Volver a verde
                }
                
                if (gameVidas <= 0) {
                    finalizarSistemaJuego(false, "Consola bloqueada. Superaste el límite de fallos.");
                }
            }
            
            if (txtVidas) {
                let stringCorazones = "❤️ ".repeat(gameVidas) || "❌";
                txtVidas.innerText = `INTENTOS: ${stringCorazones} | PUNTOS: ${gamePuntos}`;
            }
        }


        document.getElementById("btn-abandonar-nivel").onclick = function() {
            finalizarSistemaJuego(false, "Partida cancelada voluntariamente por el piloto.");
        };

                function finalizarSistemaJuego(victoria, mensajeResultado) {
            gameCorriendo = false;
            cancelAnimationFrame(animacionFrameId);
            
            // 📡 ACTIVAR CARTEL DIGITAL EN LUGAR DE ALERT
            const cartel = document.getElementById("aion-cartel-resultado");
            const cTitulo = document.getElementById("cartel-titulo");
            const cMensaje = document.getElementById("cartel-mensaje");
            const cPuntos = document.getElementById("cartel-puntos");

            if (cartel && cTitulo && cMensaje && cPuntos) {
                // Configurar colores y textos según el resultado del piloto
                if (victoria) {
                    cartel.style.borderColor = "#00ff88"; // Borde verde
                    cTitulo.innerText = "🔓 SISTEMA EN LÍNEA";
                    cTitulo.style.color = "#00ff88";
                } else {
                    cartel.style.borderColor = "#ef4444"; // Borde rojo
                    cTitulo.innerText = "🔒 INTRUSIÓN DETENIDA";
                    cTitulo.style.color = "#ef4444";
                }
                cMensaje.innerText = mensajeResultado;
                cPuntos.innerText = `${gamePuntos} PTS`;
                
                // Mostrar el cartel en pantalla
                cartel.style.display = "flex";
            }

            const cuentaLocal = localStorage.getItem("cuenta_aion_instalada");
            if (cuentaLocal) {
                const perfil = JSON.parse(cuentaLocal);
                const llaveHistorialAlumno = `aion_game_history_${perfil.nombre || 'Piloto'}_${perfil.codigo || 'AION'}`;
                
                let historialPartidas = JSON.parse(localStorage.getItem(llaveHistorialAlumno)) || [];
                historialPartidas.push({ fecha: new Date().toLocaleTimeString(), puntos: gamePuntos });
                localStorage.setItem(llaveHistorialAlumno, JSON.stringify(historialPartidas));
            }

            // Regresar el tablero a su estado base
            document.getElementById("aion-game-tablero-activo").style.display = "none";
            document.getElementById("contenedor-apuntes-hangar").style.display = "grid";
            document.getElementById("aion-game-menu-inicio").style.display = "flex";

            for (let i = 0; i < 3; i++) {
                const gap = document.getElementById(`gap-${i}`);
                if (gap) {
                    gap.innerText = "____";
                    gap.style.backgroundColor = "#ffffff";
                    gap.style.color = "#000000";
                    gap.style.borderColor = "#000000";
                }
            }
        }
