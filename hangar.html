<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM | Hangar de Pilotos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background-color: #060913;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-navbar {
            width: 100%; background-color: rgba(35, 39, 42, 0.95); border-bottom: 2px solid #f0a04b;
            box-shadow: 0 4px 15px rgba(240, 160, 75, 0.3); padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .brand-logo { font-size: 1.25rem; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        .btn-account {
            background-color: #ffffff; color: #23272a; border: none; padding: 10px 24px;
            border-radius: 25px; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-decoration: none;
        }
        .hangar-container { max-width: 900px; width: 90%; padding: 40px 0; text-align: center; }
        
        /* Contenedor de la cabecera del Hangar con los botones de control de tu boceto */
        .hangar-header-actions {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
        }
        .btn-regresar-verde {
            background: #00ff88; color: #060913; border: none; padding: 10px 20px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-family: monospace;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        /* El BOTÓN AZUL de confirmación de tu esquema de Word */
        .btn-confirmar-azul {
            background: #404eed; color: #ffffff; border: none; padding: 10px 25px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-family: monospace;
            box-shadow: 0 0 15px rgba(64, 78, 237, 0.4); transition: background 0.2s;
        }
        .btn-confirmar-azul:hover { background: #5765f2; }

        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        @media (max-width: 768px) {
            .avatar-grid { grid-template-columns: repeat(2, 1fr); }
            .hangar-header-actions { flex-direction: column; gap: 15px; }
        }
        
        .avatar-card {
            background: #111622; border: 2px solid rgba(0, 255, 136, 0.1); border-radius: 12px;
            padding: 20px; cursor: pointer; transition: all 0.2s ease;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        /* Estado cuando pasas el mouse por encima */
        .avatar-card:hover { transform: translateY(-3px); border-color: rgba(0, 255, 136, 0.5); }
        
        /* Clase especial que se activa al hacer clic (Borde verde neón activo) */
        .avatar-card.seleccionada {
            border-color: #00ff88 !important;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            background: #162032;
        }
        
        .avatar-card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #404eed; background: #1a2238; }
        .avatar-card span { font-family: monospace; font-weight: bold; font-size: 12px; color: #ffffff; letter-spacing: 1px; }
    </style>
</head>
<body>

    <header class="top-navbar">
        <div class="brand-logo" onclick="window.location.href='index.html'">AION SPACE SYSTEM</div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <a href="https://discord.gg" target="_blank" class="btn-account">Conectar Discord</a>
            <img id="avatar-nav-bar" src="logo.png" onclick="window.location.href='hangar.html'" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid #00ff88; cursor: pointer; object-fit: cover;">
        </div>
    </header>

    <main class="hangar-container">
        
        <!-- Bloque de acciones según tu esquema de Word -->
        <div class="hangar-header-actions">
            <button class="btn-regresar-verde" onclick="window.location.href='index.html'">◀ VOLVER AL CONTROL</button>
            <button id="btn-guardar-avatar-azul" class="btn-confirmar-azul">💾 TRANSMITIR AVATAR</button>
        </div>

        <div class="avatar-grid">
            <div class="avatar-card" data-avatar="logo.png" onclick="marcarSeleccionVisual(this)">
                <img src="logo.png" onerror="this.src='https://placehold.co'">
                <span>SISTEMA AION</span>
            </div>
            <div class="avatar-card" data-avatar="piloto1.png" onclick="marcarSeleccionVisual(this)">
                <img src="piloto1.png" onerror="this.src='https://placehold.co'">
                <span>PILOTO TÁCTICO 01</span>
            </div>
            <div class="avatar-card" data-avatar="piloto2.png" onclick="marcarSeleccionVisual(this)">
                <img src="piloto2.png" onerror="this.src='https://placehold.co'">
                <span>PILOTO TÁCTICO 02</span>
            </div>
            <div class="avatar-card" data-avatar="piloto3.png" onclick="marcarSeleccionVisual(this)">
                <img src="piloto3.png" onerror="this.src='https://placehold.co'">
                <span>PILOTO TÁCTICO 03</span>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, onAuthStateChanged } from "https://gstatic.com";
        import { getDatabase, ref, update } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCAb9jQGpTgP_rSWPczHoZYHGxfj5NReYI",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "aion-space-system",
            storageBucket: "aion-space-system.firebasestorage.app",
            messagingSenderId: "247082868280",
            appId: "1:247082868280:web:c0aeeb2a62bc02c2f6d0cd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let usuarioEmailLimpio = "";
        // Variable temporal para guardar qué archivo seleccionó el piloto
        let avatarTemporalSeleccionado = ""; 

        // Sincronizar sesión con el Navbar
        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioEmailLimpio = user.email.replace(/[^a-zA-Z0-9]/g, "");
                const sesion = localStorage.getItem("cuenta_aion_instalada");
                if (sesion) {
                    const perfil = JSON.parse(sesion);
                    document.getElementById("avatar-nav-bar").src = perfil.avatar || "logo.png";
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // PASO 1: Selección visual en la rejilla (Enciende el borde verde)
        window.marcarSeleccionVisual = function(elemento) {
            // Remueve la selección anterior de todas las tarjetas
            document.querySelectorAll('.avatar-card').forEach(card => {
                card.classList.remove('seleccionada');
            });
            // Añade el borde verde neón a la tarjeta presionada
            elemento.classList.add('seleccionada');
            
            // Guarda el nombre del archivo en la variable temporal
            avatarTemporalSeleccionado = elemento.getAttribute('data-avatar');
            console.log("Pre-seleccionado:", avatarTemporalSeleccionado);
        }

        // PASO 2: Acción del BOTÓN AZUL (Sube oficialmente a Firebase)
        document.getElementById("btn-guardar-avatar-azul").onclick = async function() {
            if (!usuarioEmailLimpio) return;
            
            if (avatarTemporalSeleccionado === "") {
                alert("📡 ERROR DE OPERACIÓN: Primero debes seleccionar un piloto de la cuadrícula.");
                return;
            }

            const usuarioRef = ref(db, 'usuarios/' + usuarioEmailLimpio);

            try {
                // Actualiza en el nodo correspondiente de Realtime Database
                await update(usuarioRef, { avatar: avatarTemporalSeleccionado });

                // Sincroniza la caché del navegador para el index
                const sesion = localStorage.getItem("cuenta_aion_instalada");
                if (sesion) {
                    const perfil = JSON.parse(sesion);
                    perfil.avatar = avatarTemporalSeleccionado;
                    localStorage.setItem("cuenta_aion_instalada", JSON.stringify(perfil));
                }

                // Refresca la foto del menú
                document.getElementById("avatar-nav-bar").src = avatarTemporalSeleccionado;

                alert(`📡 TRANSMISIÓN EXITOSA: Avatar congelado centralmente como [${avatarTemporalSeleccionado}]`);
            } catch (error) {
                alert("Falla crítica en el enlace del hangar: " + error.message);
            }
        }
    </script>
</body>
</html>
