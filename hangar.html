<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM | Hangar de Pilotos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background-color: #060913;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-navbar {
            width: 100%; background-color: rgba(35, 39, 42, 0.95); border-bottom: 2px solid #f0a04b;
            box-shadow: 0 4px 15px rgba(240, 160, 75, 0.3); padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .brand-logo { font-size: 1.25rem; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        .btn-account {
            background-color: #ffffff; color: #23272a; border: none; padding: 10px 24px;
            border-radius: 25px; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-decoration: none;
        }
        .hangar-container { max-width: 900px; width: 90%; padding: 40px 0; text-align: center; }
        .hangar-title { font-family: monospace; color: #00ff88; font-size: 2rem; margin-bottom: 10px; letter-spacing: 2px; }
        .hangar-subtitle { color: #b9bbbe; font-size: 1rem; margin-bottom: 40px; }
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        @media (max-width: 768px) {
            .avatar-grid { grid-template-columns: repeat(2, 1fr); }
            .top-navbar { flex-direction: column; gap: 10px; text-align: center; }
        }
        .avatar-card {
            background: #111622; border: 1px solid rgba(0, 255, 136, 0.2); border-radius: 12px;
            padding: 20px; cursor: pointer; transition: all 0.2s ease;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .avatar-card:hover { transform: translateY(-5px); border-color: #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.25); }
        .avatar-card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #404eed; background: #1a2238; }
        .avatar-card span { font-family: monospace; font-weight: bold; font-size: 12px; color: #ffffff; letter-spacing: 1px; }
    </style>
</head>
<body>

    <header class="top-navbar">
        <div class="brand-logo" onclick="window.location.href='index.html'">AION SPACE SYSTEM</div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <a href="https://discord.gg" target="_blank" class="btn-account">Conectar Discord</a>
            <img id="avatar-nav-bar" src="logo.png" onclick="window.location.href='hangar.html'" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid #00ff88; cursor: pointer; object-fit: cover;">
        </div>
    </header>

    <main class="hangar-container">
        <h1 class="hangar-title">📡 HANGAR DE PERSONALIZACIÓN</h1>
        <p class="hangar-subtitle">Selecciona tu interfaz visual para actualizar tu firma cuántica en el radar global.</p>

        <div class="avatar-grid">
            <div class="avatar-card" onclick="cambiarAvatarSistema('logo.png')">
                <img src="logo.png" onerror="this.src='https://placehold.co'">
                <span>SISTEMA AION</span>
            </div>
            <div class="avatar-card" onclick="cambiarAvatarSistema('piloto1.png')">
                <img src="piloto1.png" onerror="this.src='https://placehold.co'">
                <span>PILOTO TÁCTICO 01</span>
            </div>
            <div class="avatar-card" onclick="cambiarAvatarSistema('piloto2.png')">
                <img src="piloto2.png" onerror="this.src='https://placehold.co'">
                <span>PILOTO TÁCTICO 02</span>
            </div>
            <div class="avatar-card" onclick="cambiarAvatarSistema('piloto3.png')">
                <img src="piloto3.png" onerror="this.src='https://placehold.co'">
                <span>PILOTO TÁCTICO 03</span>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, onAuthStateChanged } from "https://gstatic.com";
        import { getDatabase, ref, update } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCAb9jQGpTgP_rSWPczHoZYHGxfj5NReYI",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "aion-space-system",
            storageBucket: "aion-space-system.firebasestorage.app",
            messagingSenderId: "247082868280",
            appId: "1:247082868280:web:c0aeeb2a62bc02c2f6d0cd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let usuarioEmailLimpio = "";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioEmailLimpio = user.email.replace(/[^a-zA-Z0-9]/g, "");
                const sesion = localStorage.getItem("cuenta_aion_instalada");
                if (sesion) {
                    const perfil = JSON.parse(sesion);
                    document.getElementById("avatar-nav-bar").src = perfil.avatar || "logo.png";
                }
            } else {
                window.location.href = "index.html";
            }
        });

        window.cambiarAvatarSistema = async function(nombreArchivo) {
            if (!usuarioEmailLimpio) return;
            const usuarioRef = ref(db, 'usuarios/' + usuarioEmailLimpio);
            try {
                await update(usuarioRef, { avatar: nombreArchivo });
                const sesion = localStorage.getItem("cuenta_aion_instalada");
                if (sesion) {
                    const perfil = JSON.parse(sesion);
                    perfil.avatar = nombreArchivo;
                    localStorage.setItem("cuenta_aion_instalada", JSON.stringify(perfil));
                }
                document.getElementById("avatar-nav-bar").src = nombreArchivo;
                alert(`📡 TRANSMISIÓN EXITOSA: Interfaz cambiada a [${nombreArchivo}]`);
            } catch (error) {
                alert("Falla en el enlace cuántico: " + error.message);
            }
        }
    </script>
</body>
</html>
