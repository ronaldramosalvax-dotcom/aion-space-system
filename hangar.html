<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM | Hangar Táctico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background-color: #060913;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-navbar {
            width: 100%;
            background-color: rgba(35, 39, 42, 0.95);
            border-bottom: 2px solid #f0a04b;
            box-shadow: 0 4px 15px rgba(240, 160, 75, 0.3);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .btn-regresar-verde {
            background: #00ff88; color: #060913; border: none; padding: 12px 20px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-family: monospace;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        .btn-escaneo-azul {
            background: #404eed; color: #ffffff; border: none; padding: 12px 25px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-family: monospace;
            box-shadow: 0 0 15px rgba(64, 78, 237, 0.4); font-size: 13px; letter-spacing: 1px;
        }
        .btn-escaneo-azul:hover { background: #5765f2; }
        .btn-account {
            background-color: #ffffff; color: #23272a; border: none; padding: 10px 24px;
            border-radius: 25px; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-decoration: none;
        }
        
        .hangar-container { max-width: 950px; width: 90%; padding: 60px 0; text-align: center; }
        .hangar-title { font-family: monospace; color: #404eed; font-size: 2.2rem; margin-bottom: 12px; letter-spacing: 2px; }
        .hangar-subtitle { color: #72767d; font-size: 1.1rem; max-width: 600px; margin: 0 auto; line-height: 1.6; }

        /* --- VENTANA EMERGENTE TÁCTICA DE TU WORD --- */
        .modal-fondo-oscuro {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 14, 23, 0.85); backdrop-filter: blur(6px);
            display: none; justify-content: center; align-items: center; z-index: 99999;
        }
        .modal-perfil-caja {
            background: #000000; border: 2px solid #404eed; border-radius: 12px;
            width: 90%; max-width: 650px; padding: 30px; display: flex;
            flex-direction: column; align-items: center; gap: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(64, 78, 237, 0.2);
            position: relative;
        }
        .btn-cerrar-modal {
            position: absolute; top: 15px; right: 15px; color: #72767d;
            cursor: pointer; font-family: monospace; font-size: 16px; transition: color 0.2s;
        }
        .btn-cerrar-modal:hover { color: #ff4757; }

        .bloque-perfil-superior {
            background: #111622; border: 2px solid #00ff88; border-radius: 8px;
            width: 140px; height: 140px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px; padding: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.15);
        }
        .bloque-perfil-superior img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #00ff88; }
        .bloque-perfil-superior span { font-family: monospace; font-size: 11px; font-weight: bold; color: #00ff88; }

        .fila-bloques-inferior {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%;
        }
        .avatar-card {
            background: #111622; border: 2px solid #ffffff; border-radius: 6px;
            min-height: 125px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px; padding: 8px;
            cursor: pointer; transition: all 0.2s ease;
        }
        .avatar-card:hover { border-color: #404eed; transform: translateY(-2px); }
        .avatar-card.seleccionada {
            border-color: #00ff88 !important; background: #162032 !important;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3) !important;
        }
        .avatar-card img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #404eed; }
        .avatar-card span { font-family: monospace; font-weight: bold; font-size: 9px; color: #ffffff; letter-spacing: 0.5px; }
            /* Estilos del monitor de tu dibujo: Fondo gris, tirador blanco */
    #scroll-box-aion::-webkit-scrollbar { width: 16px; height: 16px; }
    #scroll-box-aion::-webkit-scrollbar-track { background: #555555; }
    #scroll-box-aion::-webkit-scrollbar-thumb { background: #dddddd; border: 3px solid #555555; border-radius: 2px; }

       /* Estilo de tus mini-hojas grandes (Formato Estante del Word) */
    .mini-hoja-apunte { 
        width: 110px !important; 
        height: 170px !important; 
        background-color: #ffffff !important; 
        border: 2px solid #000000 !important; /* Bordes negros nítidos */
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 12px;
        box-sizing: border-box;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .mini-hoja-apunte:hover { 
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(59, 130, 246, 0.3);
        border-color: #3b82f6 !important;
    }
    .titulo-hoja-mini {
        color: #000000 !important;
        font-family: 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: bold;
        text-align: center;
        text-transform: uppercase;
        line-height: 1.3;
    }  
     /* Estilo del scroll interno de la hoja Word blanca */
    #visor-hoja-word::-webkit-scrollbar { width: 10px; }
    #visor-hoja-word::-webkit-scrollbar-track { background: #f1f1f1; }
    #visor-hoja-word::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
    #visor-hoja-word::-webkit-scrollbar-thumb:hover { background: #555; }
#visor-hoja-word {
    padding: 2cm !important;
    box-sizing: border-box !important;
}

    </style>
</head>
<body>

    <!-- Barra Superior -->
    <header class="top-navbar">
        <button class="btn-regresar-verde" onclick="window.location.href='index.html'">◀ VOLVER AL PANEL</button>
        
        <div style="display: flex; align-items: center; gap: 15px;">
            <button id="btn-disparar-escaner" class="btn-escaneo-azul">📡 INICIAR ESCANEO</button>
            <a href="https://discord.gg" target="_blank" class="btn-account">Conectar Discord</a>
            <img id="avatar-nav-bar" src="logo.png" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid #00ff88; object-fit: cover;">
        </div>
    </header>

        <!-- MONITOR PRINCIPAL DEL BOCETO DE WORD -->
        <div id="editor-box" style="background-color: #000000; border: 6px solid #111111; border-radius: 4px; padding: 0; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9); width: 100%; max-width: 950px; margin: 30px auto;">
        
        <!-- Barra Superior Limpia y Minimalista -->
        <div style="background-color: #0c0d12; height: 15px; border-bottom: 4px solid #1f2937;"></div>

                <!-- Marco Interior Gris con Estante y Hoja de Edición Interactiva -->
        <div style="background-color: #1a1a1a; padding: 25px; display: flex; flex-direction: column; align-items: center;">
            
            <!-- Barra de Herramientas Superior del Editor (Estilo Word) -->
            <div id="barra-herramientas-word" style="display: none; width: 100%; max-width: 750px; background: #f3f4f6; border: 1px solid #ccc; border-bottom: none; padding: 6px 12px; border-radius: 4px 4px 0 0; box-sizing: border-box; justify-content: space-between; align-items: center; gap: 10px;">
                <div style="display: flex; gap: 8px;">
                    <button onclick="document.execCommand('bold', false, null)" style="background: white; border: 1px solid #aaa; padding: 4px 8px; font-weight: bold; cursor: pointer; border-radius: 3px; color: #000;">B</button>
                    <button onclick="document.execCommand('italic', false, null)" style="background: white; border: 1px solid #aaa; padding: 4px 8px; font-style: italic; cursor: pointer; border-radius: 3px; color: #000;">I</button>
                    <button onclick="document.execCommand('underline', false, null)" style="background: white; border: 1px solid #aaa; padding: 4px 8px; text-decoration: underline; cursor: pointer; border-radius: 3px; color: #000;">U</button>
                </div>
                <button id="btn-cerrar-documento" style="background: #ef4444; color: white; border: none; padding: 5px 12px; border-radius: 4px; font-weight: bold; font-family: monospace; cursor: pointer; font-size: 11px;">
                    💾 GUARDAR Y CERRAR
                </button>
            </div>

            <!-- Tus 30 Cuadernos del Hangar -->
            <div id="contenedor-apuntes-hangar" style="display: grid; grid-template-columns: repeat(6, 110px); gap: 12px; max-height: 60vh; overflow-y: auto; padding: 10px; width: max-content;">
                <!-- Aquí se inyectan tus apuntes -->
            </div>

            <!-- LA HOJA EN BLANCO EDITABLE ESTILO WORD -->
            <div id="visor-hoja-word" style="display: none; background-color: #ffffff; color: #000000; width: 100%; max-width: 750px; min-height: 60vh; max-height: 60vh; overflow-y: auto; border: 1px solid #ccc; padding: 40px; box-sizing: border-box; text-align: left; font-family: 'Segoe UI', sans-serif; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
                <!-- Atributo contenteditable activado para tipear en vivo -->
                <div id="contenido-documento-dinamico" contenteditable="true" style="outline: none; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 20px; text-align: left; padding: 5px; color: #000000; background-image: linear-gradient(rgba(106, 90, 205, 0.25) 1px, transparent 1px), linear-gradient(90deg, rgba(106, 90, 205, 0.25) 1px, transparent 1px); background-size: 20px 20px; background-attachment: local;">


                    <!-- Aquí se tipeará el texto libremente -->
                </div>
            </div>

        </div>


    <!-- VENTANA EMERGENTE DE TU WORD -->
    <div id="modal-perfil-flotante" class="modal-fondo-oscuro">
        <div class="modal-perfil-caja">
            <span id="btn-cerrar-x" class="btn-cerrar-modal">✖</span>
            
            <div class="bloque-perfil-superior">
                <img id="avatar-modal-perfil" src="logo.png">
                <span>TU PERFIL</span>
            </div>

            <div class="fila-bloques-inferior">
                <div class="avatar-card" data-avatar="logo.png" id="btn-sel-logo">
                    <img src="logo.png">
                    <span>SISTEMA AION</span>
                </div>
                <div class="avatar-card" data-avatar="piloto1.png" id="btn-sel-p1">
                    <img src="piloto1.png">
                    <span>PILOTO 01</span>
                </div>
                <div class="avatar-card" data-avatar="piloto2.png" id="btn-sel-p2">
                    <img src="piloto2.png">
                    <span>PILOTO 02</span>
                </div>
                <div class="avatar-card" data-avatar="piloto3.png" id="btn-sel-p3">
                    <img src="piloto3.png">
                    <span>PILOTO 03</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MOTOR DE FIREBASE CON SEGUROS DE INYECCIÓN POR ID -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCAb9jQGpTgP_rSWPczHoZYHGxfj5NReYI",
            authDomain: "aion-space-system.firebaseapp.com",
            databaseURL: "https://aion-space-system-default-rtdb.firebaseio.com/",
            projectId: "aion-space-system",
            storageBucket: "aion-space-system.firebasestorage.app",
            messagingSenderId: "247082868280",
            appId: "1:247082868280:web:c0aeeb2a62bc02c2f6d0cd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let usuarioEmailLimpio = "";
        const sesionInmediata = localStorage.getItem("cuenta_aion_instalada");
        if (sesionInmediata) {
            const perfilInmediato = JSON.parse(sesionInmediata);
            if (perfilInmediato.avatar) {
                document.getElementById("avatar-nav-bar").src = perfilInmediato.avatar;
                document.getElementById("avatar-modal-perfil").src = perfilInmediato.avatar;
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioEmailLimpio = user.email.replace(/[^a-zA-Z0-9]/g, "");
                const sesion = localStorage.getItem("cuenta_aion_instalada");
                if (sesion) {
                    const perfil = JSON.parse(sesion);
                    document.getElementById("avatar-nav-bar").src = perfil.avatar || "logo.png";
                    document.getElementById("avatar-modal-perfil").src = perfil.avatar || "logo.png";
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // AMARRE DIRECTO POR ID: Abre el modal sin depender del HTML
        document.getElementById("btn-disparar-escaner").onclick = function() {
            document.getElementById("modal-perfil-flotante").style.display = "flex";
        };

        // Cierre de la ventana con la X
        document.getElementById("btn-cerrar-x").onclick = function() {
            document.getElementById("modal-perfil-flotante").style.display = "none";
        };

        // Escuchadores de clics independientes de los 4 bloques
        document.getElementById("btn-sel-logo").onclick = function() { GuardarAvatarFinal(this); };
        document.getElementById("btn-sel-p1").onclick = function() { GuardarAvatarFinal(this); };
        document.getElementById("btn-sel-p2").onclick = function() { GuardarAvatarFinal(this); };
        document.getElementById("btn-sel-p3").onclick = function() { GuardarAvatarFinal(this); };

       async function GuardarAvatarFinal(elemento) {
    document.querySelectorAll('.avatar-card').forEach(card => card.classList.remove('seleccionada'));
    elemento.classList.add('seleccionada');

    const archivoAvatar = elemento.getAttribute('data-avatar');
    if (!archivoAvatar) return;

    // 1. Cambio visual instantáneo en tu pantalla
    document.getElementById("avatar-nav-bar").src = archivoAvatar;
    document.getElementById("avatar-modal-perfil").src = archivoAvatar;

    // 2. Guardado automático en el almacenamiento local
    const sesion = localStorage.getItem("cuenta_aion_instalada");
    let perfil = sesion ? JSON.parse(sesion) : { nombre: "Piloto", codigo: "#AION" };
    perfil.avatar = archivoAvatar;
    localStorage.setItem("cuenta_aion_instalada", JSON.stringify(perfil));

      // 3. Sincronización con la nube en segundo plano si hay sesión
    if (usuarioEmailLimpio) {
        // CORRECCIÓN CENTRAL: Pasamos la variable 'db' oficial
        const usuarioRef = ref(db, 'usuarios/' + usuarioEmailLimpio);
        try {
            await update(usuarioRef, { avatar: archivoAvatar });
            
            // Avisamos al sistema global que el piloto cambió de identidad
            window.dispatchEvent(new Event('authPilotoListo'));
        } catch (error) {
            console.error("Falla en la nube: " + error.message);
        }
    }

    alert(`📡 TRANSMISIÓN CENTRAL EXITOSA:\nTu firma en red ahora opera bajo el avatar [${archivoAvatar}]`);
}

    </script>
                <script>
        const contenedorApuntes = document.getElementById('contenedor-apuntes-hangar');
        const visorHojaWord = document.getElementById('visor-hoja-word');
        const barraHerramientas = document.getElementById('barra-herramientas-word');
        const contenidoDinamico = document.getElementById('contenido-documento-dinamico');
        const btnCerrarDoc = document.getElementById('btn-cerrar-documento');
        
        const TOTAL_APUNTES = 30;

        // Base de datos local para almacenar tus textos editados en vivo
        let baseDatosApuntes = JSON.parse(localStorage.getItem('aion_word_notes')) || {
            3: `<h2>Problema 1: Sistemas Lineales</h2><p>Una papelería registró las ventas de cuadernos, lapiceros y borradores durante dos días. La matriz de ventas es:</p><p><b>V = [ 10 &nbsp; 15 &nbsp; 8 ]</b></p>`
        };

        let apunteActivoId = null;

        const nombresApuntes = {
            1: "💻 Menú Principal",
            2: "✨ Modo IA Asistente",
            3: "📐 Sistemas Lineales",
            4: "🧮 Introducción Matrices",
            5: "➕ Operaciones Matrices",
            6: "✖️ Producto y Potencias",
            7: "📝 Ecuaciones Lineales",
            8: "🤖 Pseudocódigo PSeInt",
            9: "🔒 Seguridad de Redes",
            10: "🧠 Estructuras Lógicas"
        };

        function generarEstante() {
            if (!contenedorApuntes) return;
            contenedorApuntes.innerHTML = '';
            const fragment = document.createDocumentFragment();
            
            for (let i = 1; i <= TOTAL_APUNTES; i++) {
                const hoja = document.createElement('div');
                hoja.className = 'mini-hoja-apunte';
                
                const nombreTexto = nombresApuntes[i] || `📄 Apunte N° ${i}`;
                hoja.innerHTML = `<span class="titulo-hoja-mini">${nombreTexto}</span>`;
                
                hoja.onclick = function() {
                    if (i === 1) { window.location.href = 'index.html'; return; }
                    if (i === 2) { window.location.href = 'ia.html'; return; }

                    // Activar el entorno estilo Microsoft Word editable
                    apunteActivoId = i;
                    contenedorApuntes.style.display = 'none'; 
                    barraHerramientas.style.display = 'flex'; 
                    visorHojaWord.style.display = 'block';    
                    
                    contenidoDinamico.innerHTML = baseDatosApuntes[i] || `<h2>${nombreTexto}</h2><p>Haz clic aquí para empezar a redactar tu apunte o problema matemático...</p>`;
                    contenidoDinamico.focus();
                };

                fragment.appendChild(hoja);
            }
            contenedorApuntes.appendChild(fragment);
        }

        // Lógica de guardado al presionar el botón rojo
        btnCerrarDoc.onclick = function() {
            if (apunteActivoId) {
                baseDatosApuntes[apunteActivoId] = contenidoDinamico.innerHTML;
                localStorage.setItem('aion_word_notes', JSON.stringify(baseDatosApuntes));
            }
            contenedorApuntes.style.display = 'grid';
            barraHerramientas.style.display = 'none';
            visorHojaWord.style.display = 'none';
            contenidoDinamico.innerHTML = '';
            apunteActivoId = null;
        };

        generarEstante();
    </script>
</body>
</html>
