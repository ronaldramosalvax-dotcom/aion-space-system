<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM - Producto de Matrices</title>
    <!-- MOTOR MATEMÁTICO MATHJAX: DIBUJA LAS MATRICES EN VIVO -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://jsdelivr.net"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f5f5f5; color: #333333; }
        .quiz-container { display: flex; width: 900px; height: 580px; background-color: #ffffff; border: 2px solid #333333; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .main-content { display: flex; flex-direction: column; width: 82%; height: 100%; position: relative; }
        .problem-block { background-color: #e2efda; color: #385723; height: 35%; padding: 25px; border-bottom: 2px solid #333333; font-size: 16px; overflow-y: auto; font-weight: bold; }
        .problem-title { font-weight: bold; font-size: 18px; margin-bottom: 8px; color: #1e4620; }
        .interactive-block { flex: 1; background-color: #ffffff; padding: 25px; display: flex; flex-direction: column; position: relative; }
        .options-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
        .option-item { display: flex; align-items: center; gap: 15px; cursor: pointer; padding: 5px; }
        .checkbox-anchor { width: 32px; height: 32px; border: 2px solid #333333; background-color: #ffffff; border-radius: 4px; flex-shrink: 0; }
        .option-item.correct .checkbox-anchor { background-color: #2b78e4 !important; border-color: #2b78e4 !important; }
        .option-item.wrong .checkbox-anchor { background-color: #ff5722 !important; border-color: #ff5722 !important; }
        .option-text { font-size: 16px; color: #333333; }
        .resolution-block { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #5b9bd5; color: white; padding: 30px; display: none; z-index: 10; cursor: pointer; overflow-y: auto; }
        .sidebar { width: 18%; border-left: 2px solid #333333; background-color: #fcfcfc; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 30px 10px; }
        .progress-text { font-size: 14px; font-weight: bold; text-align: center; color: #333333; }
        .progress-text span { color: #2b78e4; font-size: 20px; display: block; margin-top: 5px; }
        .timer-controls { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        .timer-display { font-size: 16px; font-weight: bold; color: #ff5722; visibility: hidden; }
        .btn-stop { width: 65px; height: 65px; background-color: #ffc000; border: 2px solid #000; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; color: #000; display: flex; justify-content: center; align-items: center; visibility: hidden; }
        .results-screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 40px; text-align: center; background-color: #ffffff; }
        .results-screen h2 { font-size: 28px; color: #2b78e4; margin-bottom: 20px; }
        .medal-box { font-size: 70px; margin: 20px 0; }
        .disabled { pointer-events: none; }
        .btn-back { margin-top: 25px; padding: 12px 24px; background-color: #f2f2f2; border: 2px solid #333333; color: #333333; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .btn-back:hover { background-color: #e6e6e6; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="main-content" id="question-wrapper">
            <div class="problem-block">
                <div class="problem-title" id="p-title">Problema:</div>
                <p id="p-text">Cargando...</p>
            </div>

            <div class="interactive-block" id="int-zone">
                <ul class="options-list" id="options-box"></ul>
                <div class="resolution-block" id="res-box">
                    <h3 style="margin-bottom:15px; text-decoration:underline;">RESOLUCIÓN DEL PROBLEMA</h3>
                    <div id="res-text"></div>
                    <p style="margin-top:25px; font-size:12px; opacity:0.9; text-align:center; color: white;">[ Haz clic aquí para alternar la pantalla y ver las alternativas ]</p>
                </div>
            </div>
        </div>

        <div class="sidebar" id="side-bar">
            <div class="progress-text">AION SPACE<span>Pregunta<br><font id="p-idx">1 / 10</font></span></div>
            <div class="timer-controls">
                <div class="timer-display" id="t-display">05s</div>
                <button class="btn-stop" id="s-button">STOP</button>
            </div>
        </div>

        <div class="results-screen" id="results-panel">
            <h2>Práctica Finalizada</h2>
            <p style="font-size: 18px;" id="r-score">Efectividad: 0%</p>
            <div class="medal-box" id="r-medal">🥉</div>
            <p style="font-size: 20px; font-weight: bold;" id="r-name">Medalla</p>
            <a href="index.html" class="btn-back">Volver a los Temas</a>
        </div>
    </div>

    <script>
        const problems = [
            { t: "Para poder multiplicar dos matrices A y B, de modo que exista el producto A · B, ¿qué condición obligatoria se debe cumplir según la teoría de la sesión 15?", o: ["a) Que tengan exactamente el mismo número de filas", "b) Que ambas matrices sean cuadradas e identidades", "c) Que el número de columnas de A coincida con el de filas de B", "d) Que el número de filas de A coincida con el de columnas de B", "e) No hay ninguna condición"], c: 2, r: "<b>[ REGLA DE EXISTENCIA ]</b><br>Para que el producto de matrices sea posible: El número de columnas de la primera matriz debe ser estrictamente igual al número de filas de la segunda matriz. De lo contrario, el producto NO se puede evaluar." },
            { t: "Si tenemos una matriz cuadrada M, ¿cómo se calcula correctamente su potencia al cubo (M³) según el análisis de errores de la sesión?", o: ["a) Elevando cada término individual de la matriz al cubo", "b) Multiplicando la matriz M por el escalar 3", "c) Multiplicando de forma sucesiva M · M · M", "d) Extrayendo la raíz cúbica a la diagonal principal", "e) No se puede calcular"], c: 2, r: "<b>[ OPERACIÓN DE POTENCIA MATRICIAL ]</b><br>Un error crítico y común es elevar cada celda o término de la matriz directamente al exponente.<br><br><b>Correcto:</b> M³ = M · M · M. Se debe realizar la multiplicación de fila por columna de la matriz por sí misma de manera secuencial." },
            { t: "Al evaluar el producto A · B de dos matrices de 2x2, ¿cuál es el resultado correcto si multiplicamos fila por columna según la lámina de validación?", o: ["a) Multiplicar solo los componentes de la diagonal principal", "b) Sumar los términos homólogos de ambas matrices", "c) El producto de los elementos correspondientes de la fila de A por la columna de B", "d) Multiplicar término a término las celdas equivalentes", "e) Invertir las columnas por filas"], c: 2, r: "<b>[ PROCEDIMIENTO CORRECTO ]</b><br>Multiplicando la primera fila de A por la primera columna de B de manera ordenada:<br>(0)(3) + (1)(5) = 0 + 5 = 5. El elemento resultante en la posición c11 es 5. NO se multiplica término a término de forma directa." },
            { t: "Si se efectúa el producto de la matriz A de orden 2x3 por la matriz B de orden 3x3, ¿cuál será el orden o dimensión exacta de la matriz resultante M?", o: ["a) Orden 3x3", "b) Orden 3x2", "c) Orden 2x3", "d) Orden 2x2", "e) La operación es absurda y no existe"], c: 2, r: "<b>[ ANÁLISIS DE DIMENSIONES ]</b><br>Evaluamos los extremos de los órdenes de las matrices condicionales: A(2x3) · B(3x3) = M(2x3). Los números internos (3 y 3) confirman que la operación existe. Los números externos (2 y 3) definen el orden de la matriz resultante M, la cual tendrá 2 filas y 3 columnas." },
            { t: "Del ejemplo explicativo de la página 10, determine el valor de la celda de la esquina superior izquierda (m11) de la matriz M = A · B + 2A, si el producto A · B da como primer elemento 1 y el elemento a11 de la matriz A es 1.", o: ["a) 1", "b) 2", "c) 3", "d) 4", "e) 7"], c: 2, r: "<b>[ EVALUACIÓN EN LA POSICIÓN m11 ]</b><br>m11 = (A · B)11 + 2(a11)<br><br><b>[ SUSTITUCIÓN DE VALORES ]</b><br>Sabemos por el PDF que el primer elemento del producto (A · B) es 1, y la celda a11 de la matriz A es 1:<br>m11 = 1 + 2(1) = 3." },
            { t: "Utilizando la matriz solución final M obtenida en la página 10: M = [3, 7, -3; 7, 11, 15] de orden 2x3, determine si es posible calcular su Traza (Tr(M)).", o: ["a) Tr(M) = 14", "b) Tr(M) = 29", "c) Tr(M) = 0", "d) NO se puede calcular porque la Traza solo existe en matrices CUADRADAS", "e) Tr(M) = 3"], c: 3, r: "<b>[ PROPIEDAD DE LA TRAZA MATRICIAL ]</b><br>La traza de una matriz se define estrictamente como la suma de todos los elementos ubicados en la diagonal principal.<br><br><b>[ CONCLUSIÓN DE DISEÑO ]</b><br>Dado que la matriz M resultante de la operación es de orden 2x3 (matriz rectangular), NO posee una diagonal principal definida. Por lo tanto, la operación de la Traza NO está definida para este orden." },
                        { t: "Plaza Vea quiere vender paquetes X, Y, Z de azúcar, arroz y fideo. Si la fila base de fideos es [2  6  1] y se multiplica por el vector columna de Paquetes [80; 70; 140], ¿cuál es el producto total de kilogramos de fideo?", o: ["a) 360 kg", "b) 450 kg", "c) 580 kg", "d) 720 kg", "e) 800 kg"], c: 3, r: "<b>[ MULTIPLICACIÓN FILA POR COLUMNA ]</b><br>Tomamos la tercera fila correspondiente a Fideos [2  6  1] y la multiplicamos por la columna de Paquetes:<br>Total Fideo = 2(80) + 6(70) + 1(140)<br>= 160 + 420 + 140 = 720 kg." },
            { t: "Del Ejercicio Reto 2 de la página 18, si se nos pide calcular la matriz B de la ecuación matricial A² + B = A · At, ¿cuál es el despeje algebraico correcto para aislar la matriz B?", o: ["a) B = A · At - A²", "b) B = A² - A · At", "c) B = A · At · A⁻²", "d) B = A · (At - A)", "e) B = O (Matriz nula)"], c: 0, r: "<b>[ DESPEJE ALGEBRAICO MATRICIAL ]</b><br>Partimos de la ecuación planteada en el Ejercicio Reto 2 de tu PDF:<br>A² + B = A · At<br>Para aislar la matriz incógnita B, el término A² que se encuentra sumando en el miembro izquierdo pasa al miembro derecho restando: B = A · At - A²." },
            { t: "En el Ejercicio Reto 4, se tiene una matriz A = [1, x, 0; 0, 0, y; 0, 0, z]. Si del producto A² · At solo se puede leer la última columna [-6; 2; -1], determine el valor analítico de la variable z.", o: ["a) z = 2", "b) z = 4", "c) z = -1", "d) z = 1", "e) z = 0"], c: 2, r: "<b>[ ANÁLISIS DE LA ÚLTIMA CELDA ]</b><br>Al operar las potencias y productos de la matriz triangular superior, evaluamos el término de la esquina inferior derecha (posición c33). Por la estructura de la matriz, el valor de la posición c33 depende directamente de la potencia de la base del elemento z: z³ = -1, por lo tanto z = -1." },
            { t: "Completando el análisis del Ejercicio Reto 4 del PDF, donde se descubre que las variables toman los valores numéricos de x = -3, y = 8, y z = -1, calcule el valor final de la expresión pedida: x + y + z.", o: ["a) -4", "b) 0", "c) 4", "d) 6", "e) 12"], c: 2, r: "<b>[ RECOLECCIÓN DE VARIABLES DEL RETO ]</b><br>De las celdas del Reto 4 del PDF obtenemos de forma exacta:<br>• x = -3<br>• y = 8<br>• z = -1<br><br><b>[ OPERACIÓN ARITMÉTICA ]</b><br>Sustituimos las incógnitas en la expresión solicitada:<br>Resultado = x + y + z<br>= (-3) + 8 + (-1) = 4." }
        ];

        let index = 0; let score = 0; let clock = null; let count = 5; let paused = false; let viewRes = false;

        const pTitle = document.getElementById('p-title');
        const pText = document.getElementById('p-text');
        const optionsBox = document.getElementById('options-box');
        const resBox = document.getElementById('res-box');
        const resText = document.getElementById('res-text');
        const pIdx = document.getElementById('p-idx');
        const tDisplay = document.getElementById('t-display');
        const sButton = document.getElementById('s-button');

        function render() {
            paused = false; viewRes = false; count = 5;
            clearInterval(clock);
            resBox.style.display = 'none';
            tDisplay.style.visibility = 'hidden';
            sButton.style.visibility = 'hidden';
            sButton.textContent = "STOP";
            sButton.style.backgroundColor = "#ffc000";
            optionsBox.classList.remove('disabled');

            const item = problems[index];
            pTitle.textContent = `Problema ${index + 1}:`;
            pIdx.textContent = `${index + 1} / 10`;
            pText.textContent = item.t;
            resText.innerHTML = item.r;

            optionsBox.innerHTML = '';
            item.o.forEach((txt, i) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `<div class="checkbox-anchor"></div><div class="option-text">${txt}</div>`;
                li.onclick = () => evaluate(i, item.c);
                optionsBox.appendChild(li);
            });
        }

        function evaluate(chosen, correct) {
            optionsBox.classList.add('disabled');
            const lis = document.querySelectorAll('.option-item');
            if (chosen === correct) { lis[chosen].classList.add('correct'); score++; }
            else { lis[chosen].classList.add('wrong'); }
            tDisplay.style.visibility = 'visible';
            sButton.style.visibility = 'visible';
            startClock();
        }

        function startClock() {
            tDisplay.textContent = `0${count}s`;
            clock = setInterval(() => {
                if (!paused) {
                    count--;
                    tDisplay.textContent = `0${count}s`;
                    if (count <= 0) { clearInterval(clock); step(); }
                }
            }, 1000);
        }

        sButton.onclick = function() {
            if (!paused) {
                paused = true;
                tDisplay.textContent = "PAUSA";
                sButton.textContent = "SIG.";
                sButton.style.backgroundColor = "#2ea44f";
                resBox.style.display = 'block';
                viewRes = true;
            } else { step(); }
        };

        document.getElementById('int-zone').onclick = function(e) {
            if (!paused) return;
            if (viewRes) { resBox.style.display = 'none'; viewRes = false; }
            else if (!e.target.closest('#options-box')) { resBox.style.display = 'block'; viewRes = true; }
        };

        function step() {
            index++;
            if (index < 10) { render(); }
            else { finish(); }
        }

        function finish() {
            document.getElementById('question-wrapper').style.display = 'none';
            document.getElementById('side-bar').style.display = 'none';
            document.getElementById('results-panel').style.display = 'flex';
            const pct = (score / 10) * 100;
            document.getElementById('r-score').textContent = `Efectividad: ${pct}% (${score} de 10 aciertos)`;
            const medal = document.getElementById('r-medal');
            const n = document.getElementById('r-name');
            if(score===0){ medal.textContent="❌"; n.textContent="Sin Medalla"; }
            else if(score<=2){ medal.textContent="🥉"; n.textContent="Medalla de Bronce"; }
            else if(score<=4){ medal.textContent="🥈"; n.textContent="Medalla de Plata"; }
            else if(score<=6){ medal.textContent="🥇"; n.textContent="Medalla de Oro"; }
            else if(score<=8){ medal.textContent="💎"; n.textContent="Medalla de Diamante"; }
            else { medal.textContent="🪐"; n.textContent="Medalla de Rodio"; }
        }

        render();
    </script>
</body>
</html>
