<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM | Asistente de IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #23272a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Barra de Navegación de tu Sistema AION */
        .top-navbar {
            width: 100%;
            background-color: #1e1f22;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .brand-logo {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .back-btn {
            background-color: #404eed;
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .back-btn:hover {
            background-color: #5765f2;
        }

        /* Contenedor del Chat a Pantalla Completa (Estilo la app que usamos nosotros) */
        .chat-frame-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background-color: #2b2d31;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Barra Superior de Control -->
    <header class="top-navbar">
        <a href="index.html" class="brand-logo">📡 AION SPACE SYSTEM / IA LAB</a>
        <a href="index.html" class="back-btn">← Volver al Panel</a>
    </header>

    <!-- Marco donde se incrusta el Chat interactivo tipo ChatGPT -->
    <main class="chat-frame-container">
        <iframe src="https://voiceflow.com"></iframe>
    </main>

</body>
</html>
