<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM - Hardware y Sistemas Numéricos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #000000; color: #333333; }
        .quiz-container { display: flex; width: 900px; height: 580px; background-color: #ffffff; border: 2px solid #333333; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .main-content { display: flex; flex-direction: column; width: 82%; height: 100%; position: relative; }
        .problem-block { background-color: #e3e5e8 !important; color: #000000 !important; height: 35%; padding: 25px; border-bottom: 2px solid #333333; font-size: 16px; overflow-y: auto; font-weight: bold; }
        .problem-title { font-weight: bold; font-size: 18px; margin-bottom: 8px; color: #000000 !important; }

        .interactive-block { flex: 1; background-color: #ffffff; padding: 25px; display: flex; flex-direction: column; position: relative; }
        .options-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
        .option-item { display: flex; align-items: center; gap: 15px; cursor: pointer; padding: 5px; }
        .checkbox-anchor { width: 32px; height: 32px; border: 2px solid #333333; background-color: #ffffff; border-radius: 4px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #333333; }

        .option-item.correct .checkbox-anchor { background-color: #2b78e4 !important; border-color: #2b78e4 !important; }
        .option-item.wrong .checkbox-anchor { background-color: #ff5722 !important; border-color: #ff5722 !important; }
        .option-text { font-size: 16px; color: #333333; }
        .resolution-block { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; color: #333333; padding: 30px; display: none; z-index: 10; cursor: pointer; overflow-y: auto; border: 2px solid #333333; }
        .sidebar { width: 18%; border-left: 2px solid #333333; background-color: #fcfcfc; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 30px 10px; }
        .progress-text { font-size: 14px; font-weight: bold; text-align: center; color: #333333; }
        .progress-text span { color: #2b78e4; font-size: 20px; display: block; margin-top: 5px; }
        .timer-controls { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        .timer-display { font-size: 16px; font-weight: bold; color: #ff5722; visibility: hidden; }
        .btn-stop { width: 65px; height: 65px; background-color: #ffc000; border: 2px solid #000; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; color: #000; display: flex; justify-content: center; align-items: center; visibility: hidden; }
        .results-screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 40px; text-align: center; background-color: #ffffff; }
        .results-screen h2 { font-size: 28px; color: #2b78e4; margin-bottom: 20px; }
        .medal-box { font-size: 70px; margin: 20px 0; }
        .disabled { pointer-events: none; }
        .btn-back { margin-top: 25px; padding: 12px 24px; background-color: #f2f2f2; border: 2px solid #333333; color: #333333; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .btn-back:hover { background-color: #e6e6e6; }

        .btn-esquina-flecha {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #f2f2f2;
            border: 2px solid #333333;
            color: #333333;
            border-radius: 4px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.2s;
            z-index: 999999;
        }
        .btn-esquina-flecha:hover { background-color: #e6e6e6; }

        @media (max-width: 768px) {
            html, body { overflow: hidden !important; position: fixed; width: 100vw; height: 100vh; }
            .quiz-container { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); height: auto; max-height: 86vh; width: 92%; border-radius: 6px; }
            .options-list { gap: 8px !important; }
            .option-text { font-size: 13px !important; }
            .checkbox-anchor { width: 26px !important; height: 26px !important; font-size: 13px !important; }
            .interactive-block { padding: 12px !important; }
            .problem-block { padding: 15px !important; font-size: 13.5px !important; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-esquina-flecha">←</a>

    <div class="quiz-container">
        <div class="main-content" id="question-wrapper">
            <div class="problem-block">
                <div class="problem-title" id="p-title"></div>
                <p id="p-text">Cargando...</p>
            </div>

            <div class="interactive-block" id="int-zone">
                <ul class="options-list" id="options-box"></ul>
                <div class="resolution-block" id="res-box">
                    <h3 style="margin-bottom:15px; text-decoration:underline;">RESOLUCIÓN DEL PROBLEMA</h3>
                    <div id="res-text"></div>
                    <p style="margin-top:25px; font-size:12px; opacity:0.9; text-align:center; color: white;">[ Haz clic aquí para alternar la pantalla y ver las alternativas ]</p>
                </div>
            </div>
        </div>

        <div class="sidebar" id="side-bar">
            <div class="progress-text">AION SPACE<span>Pregunta<br><font id="p-idx">1 / 10</font></span></div>
            <div class="timer-controls">
                <div class="timer-display" id="t-display">03s</div>
                <button class="btn-stop" id="s-button">STOP</button>
            </div>
        </div>

        <div class="results-screen" id="results-panel">
            <h2>Práctica Finalizada</h2>
            <p style="font-size: 18px;" id="r-score">Efectividad: 0%</p>
            <div class="medal-box" id="r-medal"></div>
            <p style="font-size: 20px; font-weight: bold;" id="r-name">Medalla</p>
            <a href="index.html" class="btn-back">Volver a los Temas</a>
        </div>
    </div>

    <script>
        const problems = [
            { 
                t: "Pregunta 1: Tomando como base los conceptos desarrollados en la sesión, defina qué es el hardware y mencione qué dispositivos le dan soporte directo a las TIC.", 
                o: [
                    "a) Es el código fuente malicioso desarrollado en kernel mode que controla de forma autónoma el proceso transaccional SQL.", 
                    "b) Es la capa lógica que define las relaciones lógicas de una base de datos documental a través de objetos estructurados JSON.", 
                    "c) Hace referencia a cualquier componente físico tangible que interactúa con los equipos de cómputo, dando soporte a las TIC mediante servidores, computadoras, dispositivos móviles, enrutadores y firewalls.", 
                    "d) Es una estrategia de analítica predictiva masiva orientada a limpiar datos duplicados mediante un mapeo del proceso ETL.", 
                    "e) Es un marco estratégico de planeamiento diseñado para monitorizar el comportamiento humano frente a fraudes de phishing."
                ], 
                c: 2, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>El hardware hace referencia a cualquier componente físico tangible que trabaja o interactúa con los equipos de cómputo. Da soporte a las TIC mediante dispositivos como servidores, equipos de cómputo, dispositivos móviles, enrutadores y firewalls." 
            },
            { 
                t: "Pregunta 2: El Internet de las cosas (IoT) permite conectar objetos físicos cotidianos a la red mundial. Identifique cuáles son los componentes de hardware principales que estructuran estos dispositivos lógicos.", 
                o: [
                    "a) Se estructuran a partir de interruptores, sensores, actuadores y controladores encargados de gestionar las señales y comunicarse con las redes.", 
                    "b) Se componen de cables coaxiales HFC distribuidos de forma unidireccional para emitir señales de televisión analógica.", 
                    "c) Utilizan de forma nativa instrucciones del tipo DDL como CREATE y ALTER para modificar la consistencia de un procesador.", 
                    "d) Están conformados por sistemas operativos del tipo Mainframe que procesan datos masivos mediante transacciones batch de red.", 
                    "e) Son tableros de control o dashboards interactivos que encriptan contraseñas humanas usando el principio de privilegio mínimo."
                ], 
                c: 0, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Los dispositivos de IoT se componen principalmente de interruptores (envían instrucciones), sensores (recopilan datos), actuadores (reciben señales para realizar acciones) y controladores (controlan señales de entrada/salida y se comunican con las redes)." 
            },
            { 
                t: "Pregunta 3: Una empresa peruana de distribución masiva desea optimizar el rastreo de sus contenedores a nivel internacional. Según el caso de aplicación revisado en clase, ¿qué tecnología de hardware específica se utilizó históricamente para resolver esta necesidad?", 
                o: [
                    "a) Se implementó un motor relacional del tipo Oracle configurado bajo la consistencia del control de transacciones TCL.", 
                    "b) Se utilizaron bases de datos descentralizadas y distribuidas basadas en cadenas de bloques Blockchain públicas.", 
                    "c) Se incorporó un sistema de multiprocesamiento basado en chips multicore domésticos conectados por fibra óptica.", 
                    "d) Consistió en etiquetar los contenedores con dispositivos de identificación por radiofrecuencia (RFID) para su control automatizado.", 
                    "e) Se diseñó un firewall perimetral lógico encargado de escanear virus e interceptaciones en la red de telefonía fija."
                ], 
                c: 3, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Una de las primeras implementaciones de IoT en el sector de la logística y el transporte consistió en etiquetar los contenedores de transporte con dispositivos de identificación por radiofrecuencia (RFID)." 
            },
            { 
                t: "Pregunta 4: El término 'servidor' posee una doble interpretación en los entornos tecnológicos de las organizaciones. Establezca la diferencia conceptual entre un servidor visto como hardware y uno visto como software.", 
                o: [
                    "a) Como hardware es una hoja de cálculo en blanco y como software es un sistema operativo Unix encargado de compilar código Java.", 
                    "b) Como hardware procesa sentencias del tipo DML y como software ejecuta protocolos de alta disponibilidad en antenas móviles.", 
                    "c) Ambas definiciones aluden a dispositivos extremadamente pequeños inalámbricos que operan exclusivamente con baterías de litio.", 
                    "d) Como hardware es una máquina física o conjunto de ellas distribuidas en red para compartir recursos; como software es un programa que provee servicios a dispositivos clientes a través de la red.", 
                    "e) Como hardware es un sensor de humedad agrícola y como software es un algoritmo criptográfico de doble factor de autenticación."
                ], 
                c: 3, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Como hardware, es una máquina física o conjunto de estas que, empleando un sistema distribuido, dan la apariencia de un gran computador en red para compartir recursos. Como software, es un programa o aplicación que permite a los dispositivos clientes utilizar un servicio a través de la red." 
            },
            { 
                t: "Pregunta 5: Las organizaciones albergan sus equipos en instalaciones físicas dedicadas. Seleccione la alternativa que detalle los componentes clave indispensables que contiene una sala de servidores corporativa.", 
                o: [
                    "a) Repositorios NoSQL híbridos, cables de cobre para telefonía analógica y manuales de ingeniería social.", 
                    "b) Servidores físicos, dispositivos de red, sistemas de almacenamiento (HDD, SSD), equipos de enfriamiento y sistemas de seguridad.", 
                    "c) Compuertas lógicas XOR integradas en tarjetas lógicas Smart Card que procesan transacciones del tipo batch.", 
                    "d) Algoritmos de minería de datos preconfigurados en plataformas de entretenimiento en la nube para reducir la latencia.", 
                    "e) Conexiones bidireccionales HFC diseñadas para propagar ondas de radiofrecuencia militar a través de satélites abiertos."
                ], 
                c: 1, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Una sala de servidores contiene servidores físicos, dispositivos de red (switches, routers, firewalls), sistemas de almacenamiento (HDD, SSD), equipos de enfriamiento para la temperatura y sistemas de seguridad." 
            },
            { 
                t: "Pregunta 6: Las grandes empresas tecnológicas globales ubican sus servidores en diversas locaciones alrededor del mundo. Explique cuáles son los objetivos de esta distribución geográfica masiva.", 
                o: [
                    "a) Forzar al sistema a operar únicamente en modo usuario para evitar que los hackers de sombrero negro modifiquen el software.", 
                    "b) Reducir costos de energía reemplazar de forma permanente la circuitería digital por álgebra booleana analógica.", 
                    "c) Eliminar la necesidad de utilizar internet cableado implementando redes privadas celulares basadas en ondas hexagonales.", 
                    "d) Modificar los lenguajes de programación transaccionales estructurados para adaptarlos a sistemas embebidos rígidos.", 
                    "e) Reducir la latencia de acceso, aumentar la tolerancia a fallos permitiendo que otra región asuma la carga si un servidor 'cae', y elevar la seguridad replicando datos."
                ], 
                c: 4, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Se distribuyen globalmente para reducir los tiempos de latencia cuando los usuarios acceden a sus servicios, aumentar la tolerancia a fallos al permitir que otra región asuma el tráfico si un servidor 'cae', y aumentar la seguridad replicando la información." 
            },
            { 
                t: "Pregunta 7: Muchas empresas han migrado de los 'Colocated servers' tradicionales hacia esquemas de 'Cloud Hosting'. De acuerdo con la clase, identifique la ventaja operativa principal de esta migración.", 
                o: [
                    "a) Permite automatizar la creación de tablas relacionales rígidas mediante comandos DCL como GRANT y REVOKE.", 
                    "b) Ofrece escalabilidad automática gracias al proveedor de la nube y deriva el mantenimiento a este, liberando de carga de trabajo a la empresa.", 
                    "c) Asegura el aislamiento físico de los componentes de hardware lógicos frente a desastres meteorológicos o incendios locales.", 
                    "d) Transforma el flujo de datos transaccionales brutos en gráficos vectoriales tridimensionales de alta disponibilidad.", 
                    "e) Facilita la inyección de programas potencialmente no deseados orientados a auditar de forma anónima las redes telefónicas."
                ], 
                c: 1, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>La ventaja del Cloud Hosting es que los servidores se vuelven escalables de forma automática gracias a las capacidades de los proveedores de la nube, derivando el mantenimiento a dicho proveedor y liberando a la empresa de esa carga de trabajo." 
            },
            { 
                t: "Pregunta 8: En los sistemas computacionales se utilizan múltiples bases numéricas. Defina formalmente qué es un sistema numérico y cuáles son los más empleados en dichos entornos.", 
                o: [
                    "a) Es un algoritmo de mapeo ETL orientado a estructurar variables lógicas en formatos de bases documentales JSON.", 
                    "b) Es una disciplina matemática denominada Álgebra Booleana que asigna etiquetas a las amenazas accidentales de red.", 
                    "c) Es un protocolo de control de accesos lógicos que restringe el uso del kernel mode a los analistas humanos del negocio.", 
                    "d) Es un conjunto de símbolos y reglas de generación para representar cualquier número, siendo los más empleados en computación el binario, octal y hexadecimal.", 
                    "e) Es un cuadro de mando analítico o dashboard interactivo que unifica tablas relacionales conectadas mediante aristas."
                ], 
                c: 3, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Un sistema numérico es un conjunto de símbolos (dígitos y/o letras) y reglas de generación que permiten representar cualquier número. En los sistemas computacionales, los más empleados son el binario, octal y hexadecimal." 
            },
            { 
                t: "Pregunta 9: La circuitería digital de una computadora está diseñada sobre bases matemáticas estrictas. Identifique la disciplina matemática y los valores lógicos que rigen el comportamiento elemental de estas variables de hardware.", 
                o: [
                    "a) Se basa en el Álgebra Booleana, con variables que solo toman dos valores simplificados en 1 (Verdadero/True/High) y 0 (Falso/False/Low).", 
                    "b) Utiliza el sistema de numeración decimal de base 10 combinado con instrucciones transaccionales SQL del tipo ROLLBACK.", 
                    "c) Se fundamenta en la teoría analítica de grafos comerciales estructurados en base a un orden cronológico invertido.", 
                    "d) Emplea el versionamiento de código descentralizado administrado nativamente por repositorios remotos en la nube.", 
                    "e) Opera bajo la estructura física de ondas electromagnéticas distribuidas en células hexagonales de radiofrecuencia."
                ], 
                c: 0, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>La circuitería digital está diseñada sobre la base del Álgebra Booleana, cuyas variables solo contienen 2 valores interpretados de forma simplificada como 1 (Verdadero, True, High) y 0 (Falso, False, Low)." 
            },
            { 
                t: "Pregunta 10: Claude Shannon sugirió aplicar el álgebra booleana al diseño de circuitos. Explique qué es una compuerta lógica y cuál es su importancia dentro del hardware de una computadora digital.", 
                o: [
                    "a) Es un programa o aplicación de software que permite a los dispositivos clientes procesar macrosistemas de archivos planos masivos.", 
                    "b) Es una política de comportamiento humano orientada a capacitar al personal corporativo frente a ataques de ingeniería social.", 
                    "c) Es un dispositivo físico cableado del tipo módem que incrementa la velocidad de las transmisiones analógicas por redes telefónicas.", 
                    "d) Es un circuito electrónico que implementa una operación booleana, alcanzando el nivel de circuitos más básico del hardware y sirviendo como bloque de construcción para computadoras digitales.", 
                    "e) Es un subconjunto de instrucciones estructuradas destinadas a administrar permisos de seguridad mediante comandos GRANT."
                ], 
                c: 3, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Una compuerta lógica es un circuito electrónico que implementa una operación booleana. Con ellas se alcanza el nivel de circuitos más básico del hardware de una computadora y sirven como bloques de construcción para implementar cualquier computadora digital." 
            }
        ];

        let index = 0; let score = 0; let clock = null; let count = 3; let paused = false; let viewRes = false;

        const pTitle = document.getElementById('p-title');
        const pText = document.getElementById('p-text');
        const optionsBox = document.getElementById('options-box');
        const resBox = document.getElementById('res-box');
        const resText = document.getElementById('res-text');
        const pIdx = document.getElementById('p-idx');
        const tDisplay = document.getElementById('t-display');
        const sButton = document.getElementById('s-button');

               function render() {
            paused = false; viewRes = false; count = 3;
            clearInterval(clock);
            resBox.style.display = 'none';
            tDisplay.style.visibility = 'hidden';
            sButton.style.visibility = 'hidden';
            sButton.textContent = "STOP";
            sButton.style.backgroundColor = "#ffc000";
            optionsBox.classList.remove('disabled');

            const item = problems[index];
            pTitle.textContent = "";
            pIdx.textContent = `${index + 1} / 10`;
            pText.textContent = item.t;
            resText.innerHTML = item.r;

            optionsBox.innerHTML = '';
            
            item.o.forEach((txt, i) => {
                const partes = txt.split(') ');
                const letra = partes[0] ? partes[0].trim() : '';
                const formula = partes.length > 1 ? partes.slice(1).join(') ').trim() : txt;

                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `<div class="checkbox-anchor">${letra}</div><div class="option-text">${formula}</div>`;
                li.onclick = () => evaluate(i, item.c);
                optionsBox.appendChild(li);
            });
        }

               function evaluate(chosen, correct) {
            optionsBox.classList.add('disabled');
            const lis = document.querySelectorAll('.option-item');
            if (chosen === correct) { 
                lis[chosen].classList.add('correct'); 
                score++; 
            } else { 
                lis[chosen].classList.add('wrong'); 
            }
            tDisplay.style.visibility = 'visible';
            sButton.style.visibility = 'visible';
            startClock();
        }


        function startClock() {
            tDisplay.textContent = `0${count}s`;
            clock = setInterval(() => {
                if (!paused) {
                    count--;
                    tDisplay.textContent = `0${count}s`;
                    if (count <= 0) { clearInterval(clock); step(); }
                }
            }, 1000);
        }

        sButton.onclick = function() {
            if (!paused) {
                paused = true;
                tDisplay.textContent = "PAUSA";
                sButton.textContent = "SIG.";
                sButton.style.backgroundColor = "#2ea44f";
                resBox.style.display = 'block';
                viewRes = true;
            } else { 
                step(); 
            }
        };

        document.getElementById('int-zone').onclick = function(e) {
            if (!paused) return;
            if (viewRes) { resBox.style.display = 'none'; viewRes = false; }
            else if (!e.target.closest('#options-box')) { resBox.style.display = 'block'; viewRes = true; }
        };

        function step() {
            index++;
            if (index < 10) { render(); }
            else { finish(); }
        }

        function finish() {
            document.getElementById('question-wrapper').style.display = 'none';
            document.getElementById('side-bar').style.display = 'none';
            
            const resultsPanel = document.getElementById('results-panel');
            resultsPanel.style.display = 'flex';
            
            const pct = (score / 10) * 100;
            document.getElementById('r-score').textContent = `Efectividad: ${pct}% (${score} de 10 correctas)`;
            
            const medalBox = document.getElementById('r-medal');
            const nameBox = document.getElementById('r-name');
            
            if (score === 10) {
                medalBox.textContent = "🌌";
                nameBox.textContent = "Medalla de Rodio - Élite Cuántica";
                nameBox.style.color = "#333333";
            } else if (score >= 8) {
                medalBox.textContent = "💎";
                nameBox.textContent = "Medalla de Diamante - Director de Misión";
                nameBox.style.color = "#b9f2ff";
            } else if (score >= 6) {
                medalBox.textContent = "🥇";
                nameBox.textContent = "Medalla de Oro - Ingeniero de Vuelo";
                nameBox.style.color = "#d4af37";
            } else if (score >= 4) {
                medalBox.textContent = "🥈";
                nameBox.textContent = "Medalla de Plata - Técnico de Operaciones";
                nameBox.style.color = "#aaa9ad";
            } else {
                medalBox.textContent = "🥉";
                nameBox.textContent = "Medalla de Bronce - Cadete en Práctica";
                nameBox.style.color = "#cd7f32";
            }
        }

        render();
    </script>

    <audio id="bgMusicSecundario" preload="auto"></audio>
    <script>
      if (localStorage.getItem('aion_music_playing') === 'true') {
        const bgMusic = document.getElementById('bgMusicSecundario');
        bgMusic.src = "musica/track1.mp3";
        bgMusic.volume = 0.25;
        bgMusic.loop = true;

        const inicializarAudioFlujo = () => {
          bgMusic.play()
            .then(() => {
              const tiempoGuardado = localStorage.getItem('aion_music_time');
              if (tiempoGuardado) bgMusic.currentTime = parseFloat(tiempoGuardado);
            })
            .catch(() => {});
          document.removeEventListener('click', inicializarAudioFlujo);
        };
        setTimeout(inicializarAudioFlujo, 100);
        document.addEventListener('click', inicializarAudioFlujo);
      }

      const bgMusicElement = document.getElementById('bgMusicSecundario');
      if (bgMusicElement) {
        bgMusicElement.addEventListener('timeupdate', () => {
          if (localStorage.getItem('aion_music_playing') === 'true' && bgMusicElement.currentTime > 0) {
            localStorage.setItem('aion_music_time', bgMusicElement.currentTime);
          }
        });
      }
    </script>
</body>
</html>
