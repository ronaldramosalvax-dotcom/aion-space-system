<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM - Simulador PSeInt Integrado</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #00ffcc;
            --text-color: #c9d1d9;
            --terminal-bg: #05070a;
            --border-color: #30363d;
        }

        body {
            font-family: 'Segoe UI', Monaco, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .subtitle {
            color: #8b949e;
            margin: 0;
            font-size: 1rem;
        }

        .workspace {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        .label-box {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .select-ejercicio {
            background-color: var(--terminal-bg);
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .select-ejercicio option {
            background-color: var(--card-bg);
            color: #ffffff;
        }

        textarea {
            width: 100%;
            height: 240px;
            background-color: var(--terminal-bg);
            color: #00ff66;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            line-height: 1.5;
        }

        .actions {
            margin: 15px 0;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #00cc99;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.3);
        }

        .btn-clear {
            background-color: transparent;
            color: #8b949e;
            border: 1px solid var(--border-color);
        }

        .btn-clear:hover {
            background-color: rgba(255,255,255,0.05);
            color: #ffffff;
        }

        .console-output {
            width: 100%;
            height: 180px;
            background-color: var(--terminal-bg);
            color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            overflow-y: auto;
            box-sizing: border-box;
            white-space: pre-wrap;
        }

        .nav-footer {
            margin-top: 25px;
        }

        .back-link {
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Simulador PSeInt Integrado</h1>
        <p class="subtitle">AION SPACE SYSTEM • Entorno Universitario de Pruebas</p>
    </header>

    <div class="workspace">
        <div class="label-box">
            <span>Editor de Pseudocódigo (Español):</span>
            <div>
                <span style="color:#8b949e; font-size:0.8rem; margin-right:5px;">Cargar Plantilla:</span>
                <select id="selectorPlantillas" class="select-ejercicio" onchange="cargarPlantilla()">
                    <option value="bienvenida">1. Saludo Inicial AION</option>
                    <option value="condicional">2. Condicional Simple (Nota Final)</option>
                    <option value="parimpar">3. Par o Impar (Operador Mod)</option>
                    <option value="repetitiva">4. Bucle Mientras (Contador)</option>
                </select>
            </div>
        </div>
        
        <textarea id="editor" spellcheck="false">Algoritmo SimuladorAion
    Escribir "¡Bienvenido al Centro de Control de AION SPACE SYSTEM!"
    Escribir "Prueba modificando este texto o creando tus variables básicas."
    
    Definir nota1, nota2, promedio Como Real
    nota1 <- 15
    nota2 <- 18
    promedio <- (nota1 + nota2) / 2
    
    Escribir "El promedio final de tus prácticas es:"
    Escribir promedio
FinAlgoritmo</textarea>

        <div class="actions">
            <button onclick="ejecutarPseudocodigo()">▶ Ejecutar Código</button>
            <button class="btn-clear" onclick="limpiarConsola()">Limpiar Consola</button>
        </div>

        <div class="label-box">
            <span>Pantalla de Salida (Consola):</span>
        </div>
        <div id="output" class="console-output">Haga clic en "Ejecutar Código" para ver los resultados aquí...</div>
    </div>

    <div class="nav-footer">
        <a href="pruebas.html" class="back-link">← Volver al Área de Pruebas</a>
    </div>
    <script>
        const plantillas = {
            bienvenida: `Algoritmo SimuladorAion
    Escribir "¡Bienvenido al Centro de Control de AION SPACE SYSTEM!"
    Escribir "Prueba modificando este texto o creando tus variables básicas."
    
    Definir nota1, nota2, promedio Como Real
    nota1 <- 15
    nota2 <- 18
    promedio <- (nota1 + nota2) / 2
    
    Escribir "El promedio final de tus prácticas es:"
    Escribir promedio
FinAlgoritmo`,

            condicional: `Algoritmo EvaluacionAsignatura
    Definir notaFinal Como Entero
    notaFinal <- 14
    
    Escribir "Evaluando estado del alumno..."
    
    Si notaFinal >= 12 Entonces
        Escribir "Felicidades. Has aprobado el ciclo académico."
    Sino
        Escribir "Alerta: Nota insuficiente para aprobar."
    FinSi
FinAlgoritmo`,

            parimpar: `Algoritmo DeterminarParImpar
    Definir numeroEvaluar, residuo Como Entero
    numeroEvaluar <- 27
    
    residuo <- numeroEvaluar % 2
    Escribir "Analizando número:"
    Escribir numeroEvaluar
    
    Si residuo = 0 Entonces
        Escribir "Resultado: El número es PAR."
    Sino
        Escribir "Resultado: El número es IMPAR."
    FinSi
FinAlgoritmo`,

            repetitiva: `Algoritmo SimuladorContador
    Definir contador Como Entero
    contador <- 1
    
    Escribir "Iniciando secuencia de bucle..."
    
    // Simulación del comportamiento secuencial
    Escribir "Iteración del sistema número: 1"
    Escribir "Iteración del sistema número: 2"
    Escribir "Iteración del sistema número: 3"
    
    Escribir "Secuencia finalizada."
FinAlgoritmo`
        };

        function cargarPlantilla() {
            const selector = document.getElementById('selectorPlantillas');
            const editor = document.getElementById('editor');
            const seleccion = selector.value;
            
            if (plantillas[seleccion]) {
                editor.value = plantillas[seleccion];
                limpiarConsola();
                document.getElementById('output').textContent = 'Plantilla cargada. Haga clic en "Ejecutar Código" para procesar.';
            }
        }

        function limpiarConsola() {
            document.getElementById('output').textContent = '';
        }

        function ejecutarPseudocodigo() {
            const code = document.getElementById('editor').value;
            const outputDiv = document.getElementById('output');
            outputDiv.textContent = ''; 
            
            const lines = code.split('\n');
            let variables = {};
            let logs = [];
            let saltarBloqueSino = false;
            let enBloqueSi = false;

            try {
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    
                    if (!line || line.startsWith('//') || line.toLowerCase().startsWith('algoritmo') || line.toLowerCase().startsWith('finalgoritmo')) {
                        continue;
                    }

                    if (line.toLowerCase().startsWith('finsi') || line.toLowerCase().startsWith('finmientras')) {
                        enBloqueSi = false;
                        saltarBloqueSino = false;
                        continue;
                    }

                    if (line.toLowerCase().startsWith('sino')) {
                        if (enBloqueSi && !saltarBloqueSino) {
                            saltarBloqueSino = true;
                        } else if (enBloqueSi && saltarBloqueSino) {
                            saltarBloqueSino = false;
                        }
                        continue;
                    }

                    if (saltarBloqueSino) continue;

                    if (line.toLowerCase().startsWith('si ')) {
                        enBloqueSi = true;
                        let condicion = line.substring(3).toLowerCase().replace('entonces', '').trim();
                        condicion = condicion.replace(/=/g, '==');
                        
                        for (let v in variables) {
                            let regex = new RegExp('\\b' + v + '\\b', 'g');
                            condicion = condicion.replace(regex, variables[v]);
                        }
                        
                        try {
                            let resultadoCondicion = eval(condicion);
                            if (resultadoCondicion) {
                                saltarBloqueSino = false;
                            } else {
                                saltarBloqueSino = true;
                            }
                        } catch(e) {
                            saltarBloqueSino = false;
                        }
                        continue;
                    }

                    if (line.toLowerCase().startsWith('escribir')) {
                        let contenido = line.substring(8).trim();
                        
                        if ((contenido.startsWith('"') && contenido.endsWith('"')) || (contenido.startsWith("'") && contenido.endsWith("'"))) {
                            logs.push(contenido.slice(1, -1));
                        } else {
                            if (variables.hasOwnProperty(contenido)) {
                                logs.push(variables[contenido]);
                            } else {
                                try {
                                    let res = eval(contenido.replace(/<-/g, '='));
                                    logs.push(res !== undefined ? res : contenido);
                                } catch(e) {
                                    logs.push(contenido);
                                }
                            }
                        }
                        continue;
                    }

                    if (line.includes('<-')) {
                        let partes = line.split('<-');
                        let varName = partes[0].trim();
                        let expresion = partes[1].trim();

                        for (let v in variables) {
                            let regex = new RegExp('\\b' + v + '\\b', 'g');
                            expresion = expresion.replace(regex, variables[v]);
                        }

                        try {
                            variables[varName] = eval(expresion);
                        } catch (err) {
                            throw new Error(`Error matemático en la línea ${i+1}`);
                        }
                        continue;
                    }
                }

                outputDiv.textContent = logs.join('\n') || "El programa se ejecutó correctamente.";
            } catch (error) {
                outputDiv.textContent = `❌ Error de Sintaxis en el Algoritmo.`;
            }
        }
    </script>
</body>
</html>
