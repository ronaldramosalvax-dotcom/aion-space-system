<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM - Práctica de Matrices</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0d1117; /* Fondo oscuro estilo AION */
            color: #c9d1d9;
        }

        .quiz-container {
            display: flex;
            width: 900px;
            height: 580px;
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            width: 82%;
            height: 100%;
        }

        /* Bloque Verde Superior para el enunciado */
        .problem-block {
            background-color: #1e3a1e; 
            color: #d4edda;
            height: 35%;
            padding: 25px;
            border-bottom: 2px solid #30363d;
            font-size: 16px;
            overflow-y: auto;
        }

        .problem-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
            color: #58a6ff;
        }

        /* Bloque Blanco/Oscuro Central Interactivo */
        .interactive-block {
            flex: 1;
            position: relative;
            background-color: #0d1117;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 2;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            padding: 4px 0;
        }

        /* Cuadraditos de selección de tus imágenes */
        .checkbox-anchor {
            width: 32px;
            height: 32px;
            border: 2px solid #58a6ff;
            background-color: #161b22;
            border-radius: 4px;
            flex-shrink: 0;
            transition: background-color 0.1s ease;
        }

        /* Colores estrictos de tu plan */
        .option-item.correct .checkbox-anchor {
            background-color: #2463eb !important; /* Azul Acertado */
            border-color: #2463eb !important;
        }

        .option-item.wrong .checkbox-anchor {
            background-color: #da3633 !important; /* Rojo Incorrecto */
            border-color: #da3633 !important;
        }

        .option-text {
            font-size: 16px;
            color: #c9d1d9;
        }

        /* Bloque Celeste de Resolución: Reemplazo total */
        .resolution-block {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1d4ed8; /* Celeste/Azul de resolución */
            color: white;
            padding: 30px;
            overflow-y: auto;
            display: none; /* Oculto al inicio */
            z-index: 10;
            cursor: pointer; /* Clic para alternar */
        }

        .resolution-block h3 {
            margin-bottom: 15px;
            text-decoration: underline;
            font-size: 20px;
        }

        .resolution-block p {
            font-size: 16px;
            line-height: 1.6;
        }

        /* Barra Lateral Derecha */
        .sidebar {
            width: 18%;
            border-left: 2px solid #30363d;
            background-color: #161b22;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 10px;
        }

        .progress-text {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
            color: #8b949e;
        }

        .progress-text span {
            color: #58a6ff;
            font-size: 20px;
            display: block;
            margin-top: 5px;
        }

        .timer-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .timer-display {
            font-size: 16px;
            font-weight: bold;
            color: #ff9f43;
            visibility: hidden;
        }

        /* Botón STOP Amarillo/Naranja */
        .btn-stop {
            width: 65px;
            height: 65px;
            background-color: #ffc000; 
            border: 2px solid #000;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Pantalla de Resultados Finales */
        .results-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 40px;
            text-align: center;
        }

        .results-screen h2 {
            font-size: 28px;
            color: #58a6ff;
            margin-bottom: 20px;
        }

        .medal-box {
            font-size: 70px;
            margin: 20px 0;
            animation: pop 0.5s ease;
        }

        .disabled {
            pointer-events: none; /* Bloquea clics múltiples */
        }

        .btn-back {
            margin-top: 25px;
            padding: 12px 24px;
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }
        .btn-back:hover {
            background-color: #30363d;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            90% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <!-- Contenido principal de la prueba -->
        <div class="main-content" id="normal-view">
            <div class="problem-block">
                <div class="problem-title" id="prob-title">Problema 1:</div>
                <p id="prob-text">Cargando enunciado...</p>
            </div>

            <div class="interactive-block" id="interactive-zone">
                <!-- Ventana de opciones -->
                <ul class="options-list" id="options-container"></ul>

                <!-- Ventana de resolución celeste (reemplazo total) -->
                <div class="resolution-block" id="resolution-zone">
                    <h3>RESOLUCIÓN DEL PROBLEMA</h3>
                    <p id="resolution-text"></p>
                    <p style="margin-top:25px; font-size:12px; opacity:0.8; text-align:center;">[ Haz clic en cualquier parte de esta ventana celeste para alternar y ver las alternativas ]</p>
                </div>
            </div>
        </div>

        <!-- Barra lateral -->
        <div class="sidebar" id="sidebar-box">
            <div class="progress-text">
                AION SPACE<br>SYSTEM
                <span id="progress-idx">1 / 10</span>
            </div>
            
            <div class="timer-controls">
                <div class="timer-display" id="timer-text">05s</div>
                <button class="btn-stop" id="stop-button">STOP</button>
            </div>
        </div>

        <!-- Pantalla de medallas final -->
        <div class="results-screen" id="results-zone">
            <h2>Práctica Finalizada</h2>
            <p style="font-size: 18px;" id="score-text">Efectividad: 0%</p>
            <div class="medal-box" id="medal-icon">🥉</div>
            <p style="font-size: 20px; font-weight: bold;" id="medal-name">Medalla</p>
            <a href="index.html" class="btn-back">Volver a los Temas</a>
        </div>
    </div>
