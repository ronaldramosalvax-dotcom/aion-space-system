<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION SPACE SYSTEM - Bases de Datos NoSQL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #000000; color: #333333; }
        .quiz-container { display: flex; width: 900px; height: 580px; background-color: #ffffff; border: 2px solid #333333; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .main-content { display: flex; flex-direction: column; width: 82%; height: 100%; position: relative; }
        .problem-block { background-color: #e3e5e8 !important; color: #000000 !important; height: 35%; padding: 25px; border-bottom: 2px solid #333333; font-size: 16px; overflow-y: auto; font-weight: bold; }
        .problem-title { font-weight: bold; font-size: 18px; margin-bottom: 8px; color: #000000 !important; }

        .interactive-block { flex: 1; background-color: #ffffff; padding: 25px; display: flex; flex-direction: column; position: relative; }
        .options-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
        .option-item { display: flex; align-items: center; gap: 15px; cursor: pointer; padding: 5px; }
        .checkbox-anchor { width: 32px; height: 32px; border: 2px solid #333333; background-color: #ffffff; border-radius: 4px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #333333; }

        .option-item.correct .checkbox-anchor { background-color: #2b78e4 !important; border-color: #2b78e4 !important; }
        .option-item.wrong .checkbox-anchor { background-color: #ff5722 !important; border-color: #ff5722 !important; }
        .option-text { font-size: 16px; color: #333333; }
        .resolution-block { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; color: #333333; padding: 30px; display: none; z-index: 10; cursor: pointer; overflow-y: auto; border: 2px solid #333333; }
        .sidebar { width: 18%; border-left: 2px solid #333333; background-color: #fcfcfc; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 30px 10px; }
        .progress-text { font-size: 14px; font-weight: bold; text-align: center; color: #333333; }
        .progress-text span { color: #2b78e4; font-size: 20px; display: block; margin-top: 5px; }
        .timer-controls { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        .timer-display { font-size: 16px; font-weight: bold; color: #ff5722; visibility: hidden; }
        .btn-stop { width: 65px; height: 65px; background-color: #ffc000; border: 2px solid #000; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; color: #000; display: flex; justify-content: center; align-items: center; visibility: hidden; }
        .results-screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 40px; text-align: center; background-color: #ffffff; }
        .results-screen h2 { font-size: 28px; color: #2b78e4; margin-bottom: 20px; }
        .medal-box { font-size: 70px; margin: 20px 0; }
        .disabled { pointer-events: none; }
        .btn-back { margin-top: 25px; padding: 12px 24px; background-color: #f2f2f2; border: 2px solid #333333; color: #333333; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .btn-back:hover { background-color: #e6e6e6; }

        .btn-esquina-flecha {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #f2f2f2;
            border: 2px solid #333333;
            color: #333333;
            border-radius: 4px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.2s;
            z-index: 999999;
        }
        .btn-esquina-flecha:hover { background-color: #e6e6e6; }

                @media (max-width: 768px) {
            html, body { overflow: hidden !important; position: fixed; width: 100vw; height: 100vh; }
            .quiz-container { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); height: auto; max-height: 86vh; width: 92%; border-radius: 6px; }
            .options-list { gap: 8px !important; }
            .option-text { font-size: 13px !important; }
            .checkbox-anchor { width: 26px !important; height: 26px !important; font-size: 13px !important; }
            .interactive-block { padding: 12px !important; }
            .problem-block { padding: 15px !important; font-size: 13.5px !important; }
        }

    </style>
</head>
<body>

    <a href="index.html" class="btn-esquina-flecha">←</a>

    <div class="quiz-container">
        <div class="main-content" id="question-wrapper">
            <div class="problem-block">
                <div class="problem-title" id="p-title"></div>
                <p id="p-text">Cargando...</p>
            </div>

            <div class="interactive-block" id="int-zone">
                <ul class="options-list" id="options-box"></ul>
                <div class="resolution-block" id="res-box">
                    <h3 style="margin-bottom:15px; text-decoration:underline;">RESOLUCIÓN DEL PROBLEMA</h3>
                    <div id="res-text"></div>
                    <p style="margin-top:25px; font-size:12px; opacity:0.9; text-align:center; color: white;">[ Haz clic aquí para alternar la pantalla y ver las alternativas ]</p>
                </div>
            </div>
        </div>

        <div class="sidebar" id="side-bar">
            <div class="progress-text">AION SPACE<span>Pregunta<br><font id="p-idx">1 / 10</font></span></div>
            <div class="timer-controls">
                <div class="timer-display" id="t-display">03s</div>
                <button class="btn-stop" id="s-button">STOP</button>
            </div>
        </div>

        <div class="results-screen" id="results-panel">
            <h2>Práctica Finalizada</h2>
            <p style="font-size: 18px;" id="r-score">Efectividad: 0%</p>
            <div class="medal-box" id="r-medal"></div>
            <p style="font-size: 20px; font-weight: bold;" id="r-name">Medalla</p>
            <a href="index.html" class="btn-back">Volver a los Temas</a>
        </div>
    </div>

    <script>
        const problems = [
            { 
                t: "Pregunta 1: Explique conceptualmente qué son las bases de datos NoSQL y en qué situaciones organizacionales se justifica prioritariamente su implementación.", 
                o: [
                    "a) Son repositorios analógicos que guardan copias de seguridad de las llamadas de voz telefónicas empresariales.", 
                    "b) Son herramientas lógicas exclusivas para codificar firewalls perimetrales contra el malware del tipo phishing.", 
                    "c) Son sistemas de almacenamiento que no cumplen con el esquema entidad-relación y se usan cuando los modelos relacionales generan problemas de escalabilidad y rendimiento.", 
                    "d) Son hojas de cálculo electrónicas distribuidas en bruto que automatizan el mapeo del proceso ETL organizacional.", 
                    "e) Son tableros de control o dashboards que miden físicamente los componentes de hardware lógicos de un servidor."
                ], 
                c: 2, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Las bases de datos NoSQL son estructuras lógicas y sistemas de almacenamiento de información que no cumplen con el esquema entidad-relación. Se emplean en situaciones operativas específicas en las que los modelos relacionales tradicionales generan severos problemas de escalabilidad y rendimiento." 
            },
            { 
                t: "Pregunta 2: Identifique cuáles son las principales ventajas operativas que ofrecen los motores lógicos NoSQL al procesar volúmenes masivos de información corporativa.", 
                o: [
                    "a) Se ejecutan en computadoras de pocos recursos, ofrecen escalabilidad horizontal sumando nodos y manejan grandes volúmenes de datos mediante estructuras distribuidas.", 
                    "b) Permiten eliminar por completo la necesidad de usar sistemas operativos y conexiones lógicas de internet cableado.", 
                    "c) Reducen a cero el costo económico de adquisición de hardware físico e infraestructura de almacenamiento masivo.", 
                    "d) Reemplazan de forma automatizada las labores de programación estructurada del personal de analistas lógicos de la empresa.", 
                    "e) Modifican dinámicamente los códigos maliciosos para transformarlos en herramientas de business intelligence de alta disponibilidad."
                ], 
                c: 0, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Sus principales ventajas lógicas radican en la capacidad de ejecutarse eficientemente en máquinas de pocos recursos, poseer una escalabilidad horizontal mediante la adición de nodos para mejorar el rendimiento, y manejar enormes volúmenes de datos usando estructuras distribuidas como tablas Hash." 
            },
            { 
                t: "Pregunta 3: Describa el funcionamiento técnico del modelo NoSQL basado en Clave-Valor y mencione cómo se almacena habitualmente su contenido.", 
                o: [
                    "a) Los registros se estructuran en tablas relacionales rígidas conectadas entre sí a través de comandos DDL.", 
                    "b) Cada elemento posee una identificación mediante aristas conectadas lógicamente con una sola columna.", 
                    "c) Los datos se segmentan en bloques cifrados públicos que requieren validación descentralizada de red.", 
                    "d) Cada elemento se identifica por una llave única que agiliza la recuperación de datos, almacenándose habitualmente como un objeto binario (BLOB).", 
                    "e) La información se organiza de forma manual mediante archivos planos preprocesados y enlazados vía e-business."
                ], 
                c: 3, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>En este modelo de almacenamiento, cada elemento de información está plenamente identificado por una llave única, lo que permite recuperar los registros de forma muy veloz. La información se aloja de manera habitual bajo la estructura de un objeto binario denominado BLOB." 
            },
            { 
                t: "Pregunta 4: Explique las características de las bases de datos Documentales y qué ventaja analítica ofrecen en comparación con el modelo básico de clave-valor.", 
                o: [
                    "a) Guardan la información en forma de scripts de programación web escritos de manera nativa en lenguaje estructurado Java.", 
                    "b) Almacenan datos como documentos en estructuras como JSON o XML con clave única, permitiendo ejecutar consultas avanzadas sobre el contenido del documento.", 
                    "c) Restringen el acceso lógico de los analistas humanos aplicando de forma estricta el principio de privilegio mínimo.", 
                    "d) Conectan los nodos lógicos a través de aristas matemáticas para aplicar la teoría estadística de grafos comerciales.", 
                    "e) Funcionan como un repositorio central de archivos PDF históricos que no aceptan modificaciones lógicas de ningún tipo."
                ], 
                c: 1, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Almacenan la información como un documento utilizando estructuras simples como JSON o XML, vinculadas a una clave única por registro. Su gran ventaja analítica es que, además de permitir la búsqueda directa por clave-valor, facultan la realización de consultas avanzadas sobre el contenido interno del propio documento." 
            },
            { 
                t: "Pregunta 5: ¿Cómo se organiza internamente la información en una base de datos NoSQL del tipo Grafo y qué condición estructural se requiere para maximizar su rendimiento operativo?", 
                o: [
                    "a) Se organiza en cadenas de bloques distribuidas públicamente donde cada registro posee un hash cifrado del elemento previo.", 
                    "b) Modifica los esquemas lógicos relacionales transformándolos en objetos binarios planos optimizados para procesos ETL.", 
                    "c) Divide los conjuntos de datos de forma transaccional ejecutando comandos de control del tipo ROLLBACK y COMMIT de manera nativa.", 
                    "d) Aloja los datos en carpetas compartidas locales de alta disponibilidad inmunes a cualquier tipo de amenaza intencional.", 
                    "e) Representa datos como nodos y relaciones como aristas; requiriendo una estructura normalizada de una columna por tabla y dos por relación para máximo rendimiento."
                ], 
                c: 4, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>La información se representa conceptualmente mediante nodos y sus respectivas relaciones se plasman a través de aristas, permitiendo usar la teoría de grafos para recorrerla. Para maximizar su rendimiento, su estructura debe estar totalmente normalizada, de modo que cada tabla contenga una sola columna y cada relación posea exactamente dos aristas." 
            },
            { 
                t: "Pregunta 6: Seleccione la alternativa que contenga una lista exclusiva de sistemas gestores de bases de datos no relacionales explicados en la sesión de clase.", 
                o: [
                    "a) MySQL, Microsoft SQL Server, PostgreSQL, MariaDB y Oracle Database.", 
                    "b) Redis, Cassandra, CouchDB, Cloud Firestore, Hbase, Neo4j y MongoDB.", 
                    "c) Windows, Linux, Android, iOS y sistemas operativos de servidores embebidos.", 
                    "d) Power BI, SQL Server Integration Services, Excel y procesadores de texto estructurados.", 
                    "e) Firewall perimetral, Software Antimalware, Cifrado de datos y Autenticación de doble factor."
                ], 
                c: 1, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Los principales motores lógicos de bases de datos NoSQL presentados en el curso corresponden a Redis, Cassandra, CouchDB, Cloud Firestore, Hbase, Neo4j y MongoDB." 
            },
            { 
                t: "Pregunta 7: Defina el término Big Data o macrodatos y explique cuál es la problemática central que aborda en las organizaciones contemporáneas.", 
                o: [
                    "a) Es una arquitectura lícita de hardware que interconecta redes cableadas telefónicas para evitar caídas de señal.", 
                    "b) Alude a un volumen de datos que supera la capacidad del software convencional para ser capturado, administrado y procesado en un tiempo razonable.", 
                    "c) Es una vulnerabilidad humana de ingeniería social que se propaga a través de correos falsos de suplantación.", 
                    "d) Es el proceso automatizado de limpieza de datos duplicados que se ejecuta en bases de datos relacionales SQL.", 
                    "e) Es un marco estratégico de planeamiento diseñado para sancionar de forma inmediata las negligencias del personal interno."
                ], 
                c: 1, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Hace referencia a una cantidad masiva de datos de tal magnitud que supera por completo la capacidad técnica del software convencional para ser capturados, administrados y procesados dentro de un tiempo razonable." 
            },
            { 
                t: "Pregunta 8: La compañía Netflix utiliza la herramienta Hadoop dentro de su estrategia de Big Data. Explique el propósito operativo y comercial de esta implementación según lo detallado en clase.", 
                o: [
                    "a) Lo utiliza como un firewall lógico para evitar que piratas informáticos secuestren los datos transaccionales de las cuentas bancarias de los clientes.", 
                    "b) Le sirve para transformar sus bases de datos documentales JSON en sistemas operativos locales inmunes a desastres naturales.", 
                    "c) Permite recolectar gustos e intereses de usuarios para aplicar analítica predictiva, reduciendo el riesgo comercial al producir contenidos con éxito asegurado.", 
                    "d) Funciona para sustituir por completo el uso de internet e implementar una red de televisión digital privada distribuida.", 
                    "e) Actúa como un motor de base de datos relacional que procesa las boletas de pago del personal corporativo mediante comandos DML."
                ], 
                c: 2, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Netflix emplea Hadoop para recolectar masivamente los gustos e intereses de sus usuarios, permitiéndole aplicar analítica predictiva para anticiparse al comportamiento del mercado. Esto le otorga ventajas comerciales estratégicas, como producir series con garantías previas de rentabilidad y éxito asegurado." 
            },
            { 
                t: "Pregunta 9: Describa los pilares arquitectónicos que definen a la tecnología Blockchain y cómo se garantiza la integridad de su información.", 
                o: [
                    "a) Se basa en la centralización absoluta de datos dentro de un único Data Warehouse administrado por administradores de sombrero negro.", 
                    "b) Opera como un algoritmo analítico que extrae patrones ocultos desde tableros de control interactivos de alta disponibilidad.", 
                    "c) Es una base de datos descentralizada y distribuida en cadenas de bloques, donde cada bloque contiene información y la identidad del anterior, asegurados por encriptación.", 
                    "d) Consiste en una serie de políticas humanas de seguridad orientadas a capacitar a los empleados frente a ataques accidentales.", 
                    "e) Es un lenguaje de descripción de datos lógicos que opera de forma exclusiva mediante comandos CREATE, DROP y ALTER."
                ], 
                c: 2, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Es una tecnología conformada por una base de datos descentralizada, distribuida, pública o privada, estructurada en cadenas de bloques lógicos. Cada bloque posee información propia y la identificación del bloque anterior, validando la integridad de los datos gracias a un complejo sistema de encriptación." 
            },
            { 
                t: "Pregunta 10: Durante una transferencia económica registrada bajo la tecnología Blockchain, ¿qué rol cumplen los nodos de la red y por qué se considera un registro indeleble?", 
                o: [
                    "a) Los nodos actúan como servidores transaccionales relacionales que borran los registros antiguos mediante procesos automáticos de mapeo ETL.", 
                    "b) Los usuarios de la red validan la transacción pero no pueden alterarla; al unirse a la cadena, el bloque genera un registro transparente e indeleble.", 
                    "c) Los nodos funcionan como antivirus lógicos que escanean de forma continua el sistema en busca de malware del tipo ransomware.", 
                    "d) La red delega el control exclusivo de la transacción a una entidad bancaria centralizada para reducir la complejidad técnica del negocio.", 
                    "e) Los bloques se destruyen automáticamente una vez que el dinero es enviado con éxito al destinatario para liberar memoria caché."
                ], 
                c: 1, 
                r: "<b>[ SOLUCIÓN PARA EL EXAMEN ]</b><br><br>Cuando se produce la transacción, esta se transmite a la red como un bloque de datos para que todos los nodos integrados la verifiquen y validen sin posibilidad de alterarla. Una vez añadido a la cadena, el bloque proporciona un registro transparente, permanente e indeleble sobre la operación." 
            }
        ];

        let index = 0; let score = 0; let clock = null; let count = 3; let paused = false; let viewRes = false;

        const pTitle = document.getElementById('p-title');
        const pText = document.getElementById('p-text');
        const optionsBox = document.getElementById('options-box');
        const resBox = document.getElementById('res-box');
        const resText = document.getElementById('res-text');
        const pIdx = document.getElementById('p-idx');
        const tDisplay = document.getElementById('t-display');
        const sButton = document.getElementById('s-button');

        function render() {
            paused = false; viewRes = false; count = 3;
            clearInterval(clock);
            resBox.style.display = 'none';
            tDisplay.style.visibility = 'hidden';
            sButton.style.visibility = 'hidden';
            sButton.textContent = "STOP";
            sButton.style.backgroundColor = "#ffc000";
            optionsBox.classList.remove('disabled');

            const item = problems[index];
            pTitle.textContent = "";
            pIdx.textContent = `${index + 1} / 10`;
            pText.textContent = item.t;
            resText.innerHTML = item.r;

            optionsBox.innerHTML = '';
            
            item.o.forEach((txt, i) => {
                const partes = txt.split(') ');
                const letra = partes[0] ? partes[0].trim() : '';
                const formula = partes[1] ? partes[1].trim() : txt;

                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `<div class="checkbox-anchor">${letra}</div><div class="option-text">${formula}</div>`;
                li.onclick = () => evaluate(i, item.c);
                optionsBox.appendChild(li);
            });
        }

                function evaluate(chosen, correct) {
            optionsBox.classList.add('disabled');
            const lis = document.querySelectorAll('.option-item');
            
            if (chosen === correct) { 
                // Si acertó, pintamos la correcta de azul
                lis[chosen].classList.add('correct'); 
                score++; 
            } else { 
                // Si se equivocó: pintamos la elegida de rojo...
                lis[chosen].classList.add('wrong'); 
                // ... ¡Y pintamos la correcta de azul al mismo tiempo!
                lis[correct].classList.add('correct'); 
            }
            tDisplay.style.visibility = 'visible';
            sButton.style.visibility = 'visible';
            startClock();
        }


        function startClock() {
            tDisplay.textContent = `0${count}s`;
            clock = setInterval(() => {
                if (!paused) {
                    count--;
                    tDisplay.textContent = `0${count}s`;
                    if (count <= 0) { clearInterval(clock); step(); }
                }
            }, 1000);
        }

        sButton.onclick = function() {
            if (!paused) {
                paused = true;
                tDisplay.textContent = "PAUSA";
                sButton.textContent = "SIG.";
                sButton.style.backgroundColor = "#2ea44f";
                resBox.style.display = 'block';
                viewRes = true;
            } else { 
                step(); 
            }
        };

        document.getElementById('int-zone').onclick = function(e) {
            if (!paused) return;
            if (viewRes) { resBox.style.display = 'none'; viewRes = false; }
            else if (!e.target.closest('#options-box')) { resBox.style.display = 'block'; viewRes = true; }
        };

        function step() {
            index++;
            if (index < 10) { render(); }
            else { finish(); }
        }

        function finish() {
            document.getElementById('question-wrapper').style.display = 'none';
            document.getElementById('side-bar').style.display = 'none';
            
            const resultsPanel = document.getElementById('results-panel');
            resultsPanel.style.display = 'flex';
            
            const pct = (score / 10) * 100;
            document.getElementById('r-score').textContent = `Efectividad: ${pct}% (${score} de 10 correctas)`;
            
            const medalBox = document.getElementById('r-medal');
            const nameBox = document.getElementById('r-name');
            
            if (score === 10) {
                medalBox.textContent = "🌌";
                nameBox.textContent = "Medalla de Rodio - Élite Cuántica";
                nameBox.style.color = "#333333";
            } else if (score >= 8) {
                medalBox.textContent = "💎";
                nameBox.textContent = "Medalla de Diamante - Director de Misión";
                nameBox.style.color = "#b9f2ff";
            } else if (score >= 6) {
                medalBox.textContent = "🥇";
                nameBox.textContent = "Medalla de Oro - Ingeniero de Vuelo";
                nameBox.style.color = "#d4af37";
            } else if (score >= 4) {
                medalBox.textContent = "🥈";
                nameBox.textContent = "Medalla de Plata - Técnico de Operaciones";
                nameBox.style.color = "#aaa9ad";
            } else {
                medalBox.textContent = "🥉";
                nameBox.textContent = "Medalla de Bronce - Cadete en Práctica";
                nameBox.style.color = "#cd7f32";
            }
        }

        render();
    </script>

    <audio id="bgMusicSecundario" preload="auto"></audio>
    <script>
      if (localStorage.getItem('aion_music_playing') === 'true') {
        const bgMusic = document.getElementById('bgMusicSecundario');
        bgMusic.src = "musica/track1.mp3";
        bgMusic.volume = 0.25;
        bgMusic.loop = true;

        const inicializarAudioFlujo = () => {
          bgMusic.play()
            .then(() => {
              const tiempoGuardado = localStorage.getItem('aion_music_time');
              if (tiempoGuardado) bgMusic.currentTime = parseFloat(tiempoGuardado);
            })
            .catch(() => {});
          document.removeEventListener('click', inicializarAudioFlujo);
        };
        setTimeout(inicializarAudioFlujo, 100);
        document.addEventListener('click', inicializarAudioFlujo);
      }

      const bgMusicElement = document.getElementById('bgMusicSecundario');
      if (bgMusicElement) {
        bgMusicElement.addEventListener('timeupdate', () => {
          if (localStorage.getItem('aion_music_playing') === 'true' && bgMusicElement.currentTime > 0) {
            localStorage.setItem('aion_music_time', bgMusicElement.currentTime);
          }
        });
      }
    </script>
</body>
</html>
